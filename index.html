    <p class="save-note">第一次就答對的字，會變成字卡收進圖鑑。點字卡可以翻面，看字的由來。</p>
  </section>`;
}
function openDexCard(ch) {
  const w = BANK.find(x => x.字 === ch); if (!w) return;
  const e = w.字源 || {}, pic = e.類型 === '象形' ? picSVG(ch) : '';
  const parts = (e.部件 || []).length ? `<div class="parts">${e.部件.map(x => `<span>${esc(x)}</span>`).join('＋')}<b style="font-weight:400">→</b><span>${esc(ch)}</span></div>` : '';
  const ov = document.createElement('div');
  ov.className = 'dex-modal';
  ov.innerHTML = `<div class="flip"><div class="flip-in"><div class="dex-back">
    ${e.類型 ? `<span class="kind">${esc(e.類型 === '形近' ? '形近字・記法' : e.類型 === '破音' ? '破音字' : e.類型 + '字')}：${esc(KIND_TIP[e.類型] || '')}</span>` : ''}
    ${pic ? `<div class="evo">${pic}<span class="arrow">→</span><span class="big">${esc(ch)}</span></div>` : `<span class="big">${esc(ch)}</span>`}
    <span class="zy">${esc(w.注音)}</span>${parts}
    ${(w.其他讀音 || []).length ? `<p class="other-zy">也可以唸：${w.其他讀音.map(o => `<b>${esc(o.注音)}</b>${o.說明 ? `（${esc(o.說明)}）` : ''}`).join('、')}</p>` : ''}
    ${e.說明 ? `<p>${esc(e.說明)}</p>` : ''}
    <p style="color:var(--muted)">例詞：${w.例詞.map(esc).join('、')}</p>
    <button class="btn-big" data-act="dex-close">收起來</button>
  </div></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', ev => { if (ev.target === ov) ov.remove(); });
  speak(`${ch}，${w.例詞[0]}的${ch}。`); narrate(e.說明);   // 字的讀音照唸，說明算旁白
}

function renderShop() {
  const p = me();

  setBar('商店');
  const trying = S.tryItem && SHOP_BY[S.tryItem];
  const gear = { ...p.equip, ...(trying ? { [trying.slot]: trying.id } : {}) };
  const actOf = it => {
    const owned = p.owned.includes(it.id), on = p.equip[it.slot] === it.id;
    let act;
    if (owned) act = on ? `<button class="btn-small" data-act="unequip" data-id="${it.id}">脫下</button>` : `<button class="btn-small wear" data-act="equip" data-id="${it.id}">穿上</button>`;

    else act = `<span class="lack"><span><span class="coin">金</span> ${it.price}・還差 ${it.price - p.coins}</span></span>`;
    return { act, owned, on };
  };
  const card = it => {
    const { act, owned, on } = actOf(it);

/* 名次列一頁放幾列：量名次區剩下的高度，放不下才出現分頁鈕。
   名次列全部放得下還有空位（上榜不到 10 人）時，頒獎台放大把空位用掉（台高 = 0.64 × 寬 + 40） */
function lbFit() {
  const box = $('#lbList'), pg = $('#lbPager'), podw = $('.lb-podw');
  if (!box || !pg) return;
  const rows = [...box.querySelectorAll('.lb-row')], cs = getComputedStyle(box);
  const cols = cs.display === 'grid' ? +cs.getPropertyValue('--cols') || 1 : 1;
  const lay = n => { if (cols > 1) box.style.gridTemplateRows = `repeat(${Math.max(1, Math.ceil(n / cols))}, auto)`; };   // 兩欄時先排滿左欄再排右欄
  rows.forEach(r => { r.hidden = false; }); pg.hidden = true; lay(rows.length);
  if (podw) podw.style.width = '';
  if (podw && box.getBoundingClientRect().top >= podw.getBoundingClientRect().bottom - 1) {   // 手機橫放時兩個是左右並排，不放大
    const top = box.getBoundingClientRect().top, none = box.querySelector('.lb-none');   // 「下一個名次還空著」那句是上下置中的，只算它自己的高度
    const need = rows.length ? Math.max(...rows.map(r => r.getBoundingClientRect().bottom)) - top : none ? none.offsetHeight + 12 : 0;
    const free = box.clientHeight - need - 6, w = podw.offsetWidth, cap = Math.min(podw.parentElement.clientWidth, 640);
    if (free > 8 && cap > w + 4) podw.style.width = `${Math.min(cap, w + free / .64)}px`;
  }
  if (rows.length < 2) return;
  const gap = parseFloat(cs.rowGap) || 0, rh = rows[0].offsetHeight + gap;
  const fit = () => Math.max(1, Math.floor((box.clientHeight + gap) / rh)) * cols;
  if (fit() >= rows.length && box.scrollHeight <= box.clientHeight + 1) return;
  pg.hidden = false;   // 分頁鈕也佔高度，出現後重算
  const per = fit(), pages = Math.ceil(rows.length / per);
  S.heroPage = Math.max(0, Math.min(S.heroPage || 0, pages - 1));
  rows.forEach((r, k) => { r.hidden = Math.floor(k / per) !== S.heroPage; });
  lay(rows.filter(r => !r.hidden).length);
  pg.querySelector('span').textContent = `第 ${S.heroPage * per + 4}–${Math.min(rows.length, (S.heroPage + 1) * per) + 3} 名`;
  const [prev, next] = pg.querySelectorAll('button');
  prev.disabled = S.heroPage === 0; next.disabled = S.heroPage === pages - 1;
}

/* 網站版：送出表單時連雲端（按鈕先變「連線中…」，失敗把原因寫在表單上，成功回傳 true） */
async function cloudCreate(p, id, pin, run = () => registerCloud(p, id, pin)) {
  const scr = S.screen, btn = screen.querySelector('form .go'), label = btn ? btn.textContent : '';
  S.cloudBusy = true;
  if (btn) { btn.disabled = true; btn.textContent = '連線中…'; }
  let msg;
  try { msg = await run(); } finally { S.cloudBusy = false; }
  if (S.screen !== scr) return false;
  if (btn) { btn.disabled = false; btn.textContent = label; }
  if (msg) { const err = screen.querySelector('.form-err'); if (err) err.textContent = msg; sfx('wrong'); narrate(msg); return false; }
  return true;
}

function planetSkyHTML() {   // 太陽／月亮、雲：星球準備好才放進來（延後載入）

function planetMount() {

function planetProgress() {

/* 一打開就跟字庫一起下載 3D 程式庫和星球的圖（不用等字庫讀完才開始） */
function planetWarm() {
  if (PL.libP || !planetOn()) return;
  PL.libP = (new Function('u', 'return import(u)'))(PL.lib);
  PL.libP.catch(() => {});   // 失敗交給 planetLoad 處理
  const night = plNight();
  PL.warm = ['map/map_' + (night ? 'night' : 'day'), ...Object.values(PL_HALLS).map(h => 'halls/' + h[0])].map(n => { const i = new Image(); i.src = PL_ART + n + '.webp'; return i; })
    .concat(Object.keys(PET3D).map(k => { const i = new Image(); i.src = `${PET3D_ART}${k}_3d.webp`; return i; }));   // 5 隻 3D 夥伴很小（共約 130KB），一起先載
}
async function planetLoad() {
  PL.state = 'loading'; PL.done = 0; planetProgress();
  const timer = setTimeout(() => planetFail('timeout'), 20000);
  const tick = x => { PL.done++; planetProgress(); return x; };
  try {
    const T = PL.T = await (PL.libP || (new Function('u', 'return import(u)'))(PL.lib)).then(tick);   // 包在 Function 裡：不支援 import() 的舊瀏覽器也不會整支程式壞掉
    const night = plNight();
    const [map, ...halls] = await Promise.all([planetTex('map/map_' + (night ? 'night' : 'day')).then(tick), ...Object.values(PL_HALLS).map(h => planetTex('halls/' + h[0]).then(tick))]);
    if (PL.state !== 'loading') return;   // 已經逾時改成平面畫面
    clearTimeout(timer);
    planetBuild(map, halls, night);
    PL.state = 'ready';
    if ($('#planet')) { document.body.classList.add('pl-calm'); render(); setTimeout(() => document.body.classList.remove('pl-calm'), 400); }   // 重畫一次，把太陽、雲放進來（星球入口或星球上的玩家視窗）
    planetDecor();
  } catch (e) { clearTimeout(timer); console.warn('3D 星球載入失敗，改用平面畫面', e); planetFail('load'); }
}
function planetTex(name) {
  const T = PL.T;
  if (PL.tex[name]) return Promise.resolve(PL.tex[name]);
  return new T.TextureLoader().loadAsync(PL_ART + name + '.webp').then(t => { t.colorSpace = T.SRGBColorSpace; PL.tex[name] = t; return t; });
}
function planetFail(why) {
  if (PL.state === 'fail') return;

  planetStop();
  if ($('#planet')) { PL.note = '星球暫時打不開，先用平面畫面。'; render(); }   // 星球入口或星球上的玩家視窗 → 換成 2D
}
function planetBuild(map, halls, night) {
  const T = PL.T;

  const r = PL.renderer = new T.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
  r.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  r.setClearColor(0x000000, 0);
  r.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); planetFail('context'); });
  const sc = PL.scene = new T.Scene();
  PL.cam = new T.PerspectiveCamera(30, 1, .1, 60);
  map.wrapS = map.wrapT = T.MirroredRepeatWrapping;
  map.anisotropy = Math.min(8, r.capabilities.getMaxAnisotropy());
  const k = PL_R * 2;
  map.repeat.set(k, k); map.offset.set(.5 - PL_R, .5 - PL_R);
  PL.disk = new T.Mesh(new T.CircleGeometry(1, 96), new T.MeshBasicMaterial({ map }));
  PL.disk.rotation.x = -Math.PI / 2;

  rim.position.y = -.08;
  sc.add(rim);
  PL.halls = Object.keys(PL_HALLS).map((key, i) => {
    const s = planetSprite(halls[i], PL_HALLS[key][1], PL_HALLS[key][2], PL_HALL_SIZE, .05);
    s.userData = { key, ph: i * 1.7, hov: 1, want: 1 };

}
function planetXZ(x, y) { return [(x - .5) / PL_R, (y - .5) / PL_R]; }   // 圖上座標 → 圓盤上的世界座標
function planetSprite(tex, x, y, size, foot) {

function planetPoster() {

  const w = box.clientWidth, h = box.clientHeight, night = plNight(), key = `${w}x${h}|${night}|${box.querySelector('.pl-dock') ? 1 : 0}`;

  const sky = new Image();

      const k = Math.min(1, 900 / Math.max(w, h)), cv = document.createElement('canvas'), g = cv.getContext('2d');

      gr.addColorStop(0, night ? '#0B1640' : '#8FD3FF'); gr.addColorStop(1, night ? '#1E2E66' : '#FFF4CF');
      g.fillStyle = gr; g.fillRect(0, 0, cv.width, cv.height);
      const sc = Math.max(cv.width / sky.width, cv.height / sky.height), dw = sky.width * sc, dh = sky.height * sc;
      g.drawImage(sky, (cv.width - dw) / 2, cv.height - dh, dw, dh);

      localStorage.setItem('zizi-plposter' + (night ? '-n' : ''), JSON.stringify({ w, h, n: night ? 1 : 0, d: box.querySelector('.pl-dock') ? 1 : 0, u: cv.toDataURL('image/jpeg', .72) }));

/* 鏡頭：看上下兩列中間那塊空間的長寬比——寬的用低一點的角度（約 36～42°），直立平板約 58°，又高又窄的手機約 66°；
   找一個距離讓圓盤和 4 棟館都放進上方一列和下方圖示列中間 */
function planetFit() {
  const box = PL.box, T = PL.T;
  if (!box || !box.isConnected) return;
  const w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;
  PL.renderer.setSize(w, h, false);
  const br = box.getBoundingClientRect(), topEl = box.querySelector('.pl-top'), dock = box.querySelector('.pl-dock');
  const topH = topEl ? topEl.getBoundingClientRect().bottom - br.top : 0, botH = dock ? br.bottom - dock.getBoundingClientRect().top : 0;
  if (topEl) box.style.setProperty('--pl-top', topH + 'px');
  const cam = PL.cam, asp = w / Math.max(1, h - topH - botH);
  cam.aspect = w / h;
  const el = (asp <= .55 ? 66 : asp <= .8 ? 66 - (asp - .55) / .25 * 8 : asp <= 1.5 ? 58 - (asp - .8) / .7 * 16 : Math.max(36, 42 - (asp - 1.5) * 6)) * Math.PI / 180;
  const up = new T.Vector3(0, Math.cos(el), -Math.sin(el));
  const pts = [];
  for (let i = 0; i < 48; i++) { const a = i / 48 * Math.PI * 2; pts.push(new T.Vector3(Math.cos(a), 0, Math.sin(a)), new T.Vector3(Math.cos(a) * .9, -.16, Math.sin(a) * .9)); }
  PL.halls.forEach(s => pts.push(s.position.clone().addScaledVector(up, PL_HALL_SIZE * 1.02)));
  const place = d => { cam.position.set(0, Math.sin(el) * d, Math.cos(el) * d); cam.lookAt(0, 0, 0); cam.updateMatrixWorld(); cam.updateProjectionMatrix(); };
  const YHI = 1 - 2 * (topH + 10) / h, YLO = -1 + 2 * (botH + 14) / h, XM = .96;   // 上面一列、下面圖示列的位置不放星球
  const ext = () => { let x = 0, y0 = 9, y1 = -9; pts.forEach(p => { const q = p.clone().project(cam); x = Math.max(x, Math.abs(q.x)); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }); return [x, y0, y1]; };
  let lo = 1, hi = 40;
  for (let i = 0; i < 26; i++) { const d = (lo + hi) / 2; place(d); const [x, y0, y1] = ext(); if (x <= XM && y1 - y0 <= YHI - YLO) hi = d; else lo = d; }
  place(hi);
  const [, y0, y1] = ext();
  cam.projectionMatrix.elements[9] -= (YHI + YLO) / 2 - (y0 + y1) / 2;   // 星球放在上下兩列中間
  cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();
  PL.up = up;

  PL.renderer.render(PL.scene, cam);
}
function planetTags() {   // 每棟館的 HTML 按鈕＝那張 Sprite 在畫面上的範圍；科目名稱放在館的下方
  const box = PL.box, w = box.clientWidth, h = box.clientHeight, cam = PL.cam;
  const scr = v => { const q = v.clone().project(cam); return [(q.x + 1) / 2 * w, (1 - q.y) / 2 * h]; };
  PL.halls.forEach(s => {
    const b = box.querySelector(`.pl-hall[data-s="${s.userData.key}"]`);
    if (!b) return;
    const base = s.position.clone(); base.y = 0;
    const [bx, by] = scr(base), [, ty] = scr(base.clone().addScaledVector(PL.up, PL_HALL_SIZE * .92));
    const right = new PL.T.Vector3(1, 0, 0), [rx] = scr(base.clone().addScaledVector(right, PL_HALL_SIZE * .42));
    const half = Math.max(36, rx - bx);
    Object.assign(b.style, { left: (bx - half) + 'px', top: ty + 'px', width: half * 2 + 'px', height: Math.max(60, by - ty) + 'px' });

function planetStart() { if (!PL.raf && !document.hidden) { PL.last = 0; PL.raf = requestAnimationFrame(planetLoop); } }
function planetStop() { if (PL.raf) cancelAnimationFrame(PL.raf); PL.raf = 0; }
function planetLoop(now) {
  PL.raf = 0;
  if (!PL.box || !PL.box.isConnected || document.hidden || PL.state !== 'ready') return;   // 離開入口或頁面藏起來就停
  PL.raf = requestAnimationFrame(planetLoop);
  const dt = PL.last ? now - PL.last : 16;
  PL.last = now;
  if (plNight() !== PL.night) planetTheme(plNight());
  const t = now / 1000;
  PL.halls.forEach(s => {
    const u = s.userData;
    u.hov += (u.want - u.hov) * Math.min(1, dt / 90);
    const sz = PL_HALL_SIZE * u.hov;
    s.scale.set(sz, sz, 1);
    s.position.y = .012 + .012 * Math.sin(t * 1.5 + u.ph);   // 輕輕浮動
  });
  PL.decor.forEach(s => {
    const u = s.userData;
    if (u.move === 'bird') {
      const a = t * .22 + u.ph, sz = .12;   // 在星球後面的天空來回飛，不擋科目館
      s.position.set(Math.cos(a) * 1.15, .75 + .05 * Math.sin(t * 2.6), -1.1 + .12 * Math.sin(a));
      s.scale.set(-Math.sin(a) > 0 ? sz : -sz, sz, 1);   // 往右飛就朝右
    } else if (u.move === 'boat') {
      const a = t * .07 + u.ph, sz = .17;   // 沿著海邊繞一圈
      s.position.set(Math.cos(a) * .93, .01 + .008 * Math.sin(t * 2), Math.sin(a) * .93);
      s.scale.set(Math.sin(a) > 0 ? -sz : sz, sz, 1);
    }
  });
  PL.renderer.render(PL.scene, PL.cam);
}

      const lvs = subLevels(sub).map(l => l.id).filter(l => levelOpen(g, l));
      const got = lvs.reduce((s, l) => s + levelStars(p, g, l), 0), max = lvs.reduce((s, l) => s + stagesOf(g, l).length * 3, 0);
      return { act: 'grade', g, name: `${CN_NUM[g]}年級`, sub: `★ ${got}／${max}`, done: sub === 'zh' ? gradeDone(p, g) : lvs.length > 0 && lvs.every(l => levelDone(p, g, l)) };
    }))}</section>`;
    return;
  }
  screen.innerHTML = `<section class="stack">${meBar(p)}<div class="cards tight grades">${grades().map(g => {
    const lvs = subLevels(sub).map(l => l.id).filter(l => levelOpen(g, l));
    const got = lvs.reduce((s, l) => s + levelStars(p, g, l), 0);
    const max = lvs.reduce((s, l) => s + stagesOf(g, l).length * 3, 0);
    const done = sub === 'zh' ? gradeDone(p, g) : lvs.length > 0 && lvs.every(l => levelDone(p, g, l));
    const size = sub === 'zh' ? `${BANK.filter(w => w.年級 === g).length} 個字` : sub === 'en' ? `${EN.filter(w => w.年級 === g).length} 個單字` : `${lvs.length} 種題目`;
    return `<button class="card" data-act="grade" data-g="${g}" data-tone="${(g - 1) % 4 + 1}">
      ${done ? `<span class="ribbon">${CN_NUM[g]}年級破關</span>` : ''}
      <span class="num">${g}</span>
      <span class="txt"><span class="name">${CN_NUM[g]}年級</span>
      <span class="desc"><span class="ln">${size}</span><span class="ln">★ ${got}／${max}</span></span></span>
    </button>`;
  }).join('')}</div></section>`;
}

function miniStars(n) { return `<span class="mini-stars" aria-label="${n} 顆星">${[1, 2, 3].map(i => i <= n ? '★' : '<span class="off">★</span>').join('')}</span>`; }

function renderLevel() {
  const p = me(), g = S.grade;
  setBar(`${CN_NUM[g]}年級${{ zh: "", en: "英文", math: "數學" }[S.subject || "zh"]}・選關卡`);
  const sub = S.subject || 'zh', rv = reviewList(p, g, sub).length;
  if (v3d()) {   // 3D：房間裡一個玩法一個站點；功能按鈕收進選單
    const items = subLevels(sub).filter(l => levelForGrade(l, g) && (l.sub || levelOpen(g, l.id) || (openFrom(l.id) || 0) > g)).map(l => {
      const can = levelOpen(g, l.id), from = openFrom(l.id), n = stagesOf(g, l.id).length;
      const done = Array.from({ length: n }, (_, k) => passed(peek(p, g, l.id, k))).filter(Boolean).length;
      return { act: 'level', l: l.id, art: STATION_ART[l.id] || 'chinese_review', name: l.name, dis: !can, lock: !can, done: can && levelDone(p, g, l.id),
        badge: can && hasBadge(p, g, l.id) ? '勇者' : '', sub: can ? `${done}／${n} 關・★ ${levelStars(p, g, l.id)}` : from && from > g ? `${CN_NUM[from]}年級開放` : '還沒有題目' };
    });
    if (sub === 'zh' && p.assign && p.assign.chars && p.assign.chars.length) items.push({ act: 'assign', art: 'chinese_spelling', name: '指定練習', sub: `${p.assign.chars.length} 個字` });
    items.push({ act: 'review', art: 'chinese_review', name: sub === 'zh' ? '錯字複習' : '錯題複習', dis: !rv, sub: rv ? `有 ${rv} 題` : '還沒有錯題' });
    screen.innerHTML = `<section class="stack v3-room"><div class="v3-head">${meBar(p)}${v3Menu(p)}</div>${stationsHTML(items)}</section>`;
    return;
  }
  /* 國語題型：這個年級沒有題目、以後也不會開放的（例如 4～6 年級沒有筆順資料）就不顯示 */
  const cards = subLevels(sub).filter(l => levelForGrade(l, g) && (l.sub || levelOpen(g, l.id) || (openFrom(l.id) || 0) > g)).map((l, i) => {
    const can = levelOpen(g, l.id);
    const from = openFrom(l.id);
    const n = stagesOf(g, l.id).length;
    const done = Array.from({ length: n }, (_, k) => passed(peek(p, g, l.id, k))).filter(Boolean).length;
    return `<button class="card" data-act="level" data-l="${l.id}" data-tone="${i + 1}" ${can ? '' : 'disabled'}>
      ${can && hasBadge(p, g, l.id) ? '<span class="ribbon">勇者徽章</span>' : can && levelDone(p, g, l.id) ? '<span class="ribbon">破關</span>' : ''}
      <span class="num">${LEVEL_ICON[l.id]}</span>
      <span class="txt"><span class="name">${l.name}</span>
      <span class="desc">${can ? `<span class="ln">已過 ${done}／${n} 關</span><span class="ln">★ ${levelStars(p, g, l.id)}</span>` : (from && from > g ? `${CN_NUM[from]}年級開放` : '還沒有題目')}</span></span>
    </button>`;
  }).join('') + (sub === 'zh' && p.assign && p.assign.chars && p.assign.chars.length ? `<button class="card" data-act="assign" data-tone="3">
      <span class="num">${ICONS.book}</span>
      <span class="txt"><span class="name">指定練習</span><span class="desc">老師／家長指定的 ${p.assign.chars.length} 個字：${esc(p.assign.chars.slice(0, 6).join(''))}${p.assign.chars.length > 6 ? '…' : ''}</span></span>
    </button>` : '') + `<button class="card" data-act="review" data-tone="5" ${rv ? '' : 'disabled'}>
      <span class="num">${ICONS.redo}</span>
      <span class="txt"><span class="name">${sub === 'zh' ? '錯字複習' : '錯題複習'}</span>
      <span class="desc">${rv ? `有 ${rv} 題要再練習` : '答錯的題目會收集到這裡'}</span></span>
    </button>`;
  screen.innerHTML = `<section class="stack">${meBar(p)}${meActions(p)}<div class="cards tight">${cards}</div></section>`;
}

/* 英文 Book 裡的 Unit 1～30：格子排好，一課一關（不用照順序，想練哪課就點哪課）；還沒有資料的課顯示「待補」 */
function renderUnits() {
  const p = me(), b = S.grade, RL = reviewList(p, b, 'en'), rv = RL.length, have = new Set(bookUnits(b));
  const wrongIn = {}; RL.forEach(r => { const u = reviewUnit(b, r); if (u) wrongIn[u] = (wrongIn[u] || 0) + 1; });   // 每課還有幾題錯題
  const set = enSetOf(b), un = set.unit, n = unitCount(b);
  setBar(`${set.tag} ${bookName(b)}・選一課`);
  const cells = Array.from({ length: n }, (_, i) => {
    const u = i + 1, r = peek(p, b, 'e-unit', i);
    if (!have.has(u)) return `<button class="unit locked" disabled aria-label="${un} ${u}，待補"><b>${u}</b><small>待補</small></button>`;
    return `<button class="unit ${r.cleared ? 'done' : ''}" data-act="unit" data-i="${i}" aria-label="${un} ${u}${wrongIn[u] ? `，有 ${wrongIn[u]} 題錯題` : ''}"><b>${u}</b><small>${r.best ? miniStars(r.best) : `${unitWords(b, u).length} 字`}</small>${wrongIn[u] ? `<i class="wrong-n">錯 ${wrongIn[u]}</i>` : ''}</button>`;
  }).join('');
  screen.innerHTML = `<section class="stack">${meBar(p)}
    <p class="save-note">《${set.name}》${bookName(b)}・${un} 1～${n}：一課一關，拿到 ${PASS} 顆星就過關</p>
    <div class="unit-grid">${cells}</div>
    <button class="btn-small" data-act="review" ${rv ? '' : 'disabled'}>錯題複習${rv ? `（有 ${rv} 題要再練習）` : '（答錯的題目會收集到這裡）'}</button>
  </section>`;
}

/* ---------- 互動 ---------- */
/* 大人在「管理玩家」打開「已通過的關卡不能再玩」：過關的關卡（含打敗的頭目）點了只跳提示，不開始 */
const lockOn = p => !!(p && p.lockCleared);
const lockMark = p => lockOn(p) ? '<span class="lock-mark">🔒 已過關卡鎖住</span>' : '';
function toast(t) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = t; el.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 2800);
  speak(t.replace(/🔒\s*/, ''));
}
function lockedStage(i) {
  const p = me();
  if (!lockOn(p) || !peek(p, S.grade, S.level, i).cleared) return false;
  toast('🔒 這一關已經過關了，大人設定不能再玩。去玩還沒過的關卡吧！');
  return true;
}
function startStage(i) {
  if (lockedStage(i)) return;
  S.mode = 'stage'; S.stage = i; S.hop = null;
  const items = stagesOf(S.grade, S.level)[i];
  const kz = String(S.level).startsWith('kz:');
  S.qs = kz ? (kzIsMatch(kzPaper(S.level)) ? [kzMatchStart(i)] : items.map(kzQ))   // 安親班照考卷的順序出；成語配對一關是一個盤面
    : S.level === 'm-99' ? hopStage(items)   // 九九跳石頭：打亂跳石頭，再打亂打頭目
    : spreadOut(S.level === 'e-unit' ? unitQuestions(items) : shuffle(items).map(it => makeQ(S.level, it)));   // 每個字只出一題；選項差不多的題目不要連著出
  if (S.level.startsWith('m-') && S.level !== 'm-99') { const seen = new Set(); S.qs = S.qs.map((q, k) => { for (let t = 0; t < 12 && seen.has(q.ref); t++) q = makeQ(S.level, items[k]); seen.add(q.ref); return q; }); }   // 同一關的算式不重複
  if (S.qs.length >= 4 && Math.random() < CHEST_RATE) S.qs[2 + Math.floor(Math.random() * (S.qs.length - 2))].golden = true;   // 有時會有一題寶箱題
  beginRound(S.level === 'e-unit' ? `«${unitName(S.grade)} ${i + 1}»。` : kz ? `${levelInfo(S.level).name}。` : `第${i + 1}關。`);
}
/* 相鄰兩題的選項有一半以上一樣（例如 霞瑕暇 連出兩題）就往後換 */
function spreadOut(qs) {
  const set = q => new Set(q.options || []), close = (a, b) => { const A = set(a); return a.options && b.options && b.options.filter(o => A.has(o)).length >= Math.ceil(b.options.length / 2); };
  const out = qs.slice();
  for (let i = 1; i < out.length; i++) {
    if (!close(out[i - 1], out[i])) continue;
    const j = out.findIndex((q, k) => k > i && !close(out[i - 1], q) && (k + 1 >= out.length || !close(out[i], out[k + 1])));
    if (j > 0) [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}
const CHEST_RATE = 0.2;   // 大約 5 回合出現一次寶箱題；12 樣限定裝扮都拿到之後改開 30 金幣
const comboMult = c => c >= 5 ? 2 : c >= 3 ? 1.5 : 1;   // 連續第一次就答對：3 題 ×1.5、5 題 ×2（分數四捨五入）
function openChest(p) {
  ensureWallet(p);
  const pool = SHOP.filter(it => it.limited && !p.owned.includes(it.id));
  if (!pool.length) { p.coins += 30; return null; }
  const it = pick(pool); p.owned.push(it.id); return it;

/* 打地鼠：每 1 秒換一批跑出來的字，要打的字常常會出現 */
let whackTimer = 0;
function startWhack() {
  clearInterval(whackTimer);
  const q = S.qs[S.idx]; if (!q || q.type !== 'whack') return;
  let tick = 0;
  const step = () => {
    if (S.screen !== 'game' || S.answered || S.qs[S.idx] !== q) { clearInterval(whackTimer); return; }
    if ($('.party')) return;
    tick++;
    const holes = [...screen.querySelectorAll('.hole')]; if (!holes.length) return;
    const avail = q.options.map((_, k) => k).filter(k => !S.tried.includes(k));
    const show = new Set();
    const ans = q.options.indexOf(q.answer);
    if (tick % 2 === 1 || Math.random() < 0.5) show.add(ans);
    while (show.size < Math.min(3, avail.length)) show.add(pick(avail));
    const spots = shuffle(holes.map((_, k) => k)).slice(0, show.size);
    holes.forEach(h => { h.classList.remove('up'); h.removeAttribute('data-i'); h.dataset.act = 'hole'; });
    [...show].forEach((opt, n) => { const h = holes[spots[n]]; h.querySelector('.mole b').textContent = q.options[opt]; h.dataset.i = opt; h.dataset.act = 'pick'; h.classList.add('up'); });
  };
  step();
  whackTimer = setInterval(step, 1150);
}

function finishRound() {
  if (S.mode === 'secret') return finishSecret();
  const mq = S.qs[0] && S.qs[0].type === 'kz-match' ? S.qs[0] : null;   // 成語配對：一關 6 對，星星照「一次就配對成功」的比例
  const p = me(), boss = S.mode === 'boss', total = boss ? Math.min(S.qs.length, S.idx + 1) : mq ? mq.pairs.length : S.qs.length;
  const stars = boss ? (S.bossHP <= 0 ? (S.hearts >= 4 ? 3 : S.hearts >= 3 ? 2 : 1) : 0) : hopOn() && S.hop.lost ? Math.min(1, starsFor(S.firstTry, total)) : starsFor(S.firstTry, total);   // 跳石頭愛心用完就不算過關
  p.daily = p.daily || {}; const dd = p.daily[today()] || (p.daily[today()] = { n: 0, ok: 0, score: 0, sec: 0 }); dd.score += S.roundScore;
  const before = tierOf(p.stars);
  /* 星星只算「比這一關以前最好的成績多拿的」，同一關重玩不會一直加（複習、指定練習不加星星） */
  let gained = 0;
  if (S.mode === 'stage') gained = Math.max(0, stars - peek(p, S.grade, S.level, S.stage).best);
  else if (boss) { const k = badgeKey(S.grade, S.level), old = (p.bossBest && p.bossBest[k]) || 0; gained = Math.max(0, stars - old); if (stars > old) p.bossBest = { ...(p.bossBest || {}), [k]: stars }; }
  p.stars += gained;
  ensureWallet(p);
  p.score = (p.score || 0) + S.roundScore;
  const wk = weekKey();
  if (!p.week || p.week.id !== wk) p.week = { id: wk, score: 0 };
  p.week.score += S.roundScore;
  /* 金幣依題數打折：一般一關 10 題；英文一課 20 題、課又多，金幣減半，商店才不會一下子全部買完 */
  const longRound = S.level === 'e-unit' || String(S.level).startsWith('kz:');   // 英文一課 20 題、安親班一份考卷 30 幾題
  const coinsGot = Math.floor(S.roundScore * (longRound ? Math.min(1, ROUND / Math.max(1, total)) : 1) / COIN_RATE);
  p.coins += coinsGot;
  const after = tierOf(p.stars);
  const R = { stars, gained, total, score: S.roundScore, coins: coinsGot, firstTry: S.firstTry, levelUp: after > before ? after : -1, passedNow: stars >= PASS, canSkip: false, levelClear: false, gradeBadge: false,
              bestCombo: S.bestCombo, newCards: (S.newCards || []).slice(), chest: S.chestGot, land: currentLand().name, match: !!mq };
  /* 圖鑑集滿一頁：送金幣（每頁只送一次） */
  grades().forEach(g => {
    if (!(p.dexDone && p.dexDone[g]) && BANK.filter(w => w.年級 === g).every(w => p.dex && p.dex[w.字])) { p.dexDone = { ...(p.dexDone || {}), [g]: true }; p.coins += DEX_REWARD; R.dexPage = g; }
  });
  if (S.mode === 'stage') {
    const wasLevel = levelDone(p, S.grade, S.level), wasGrade = gradeDone(p, S.grade);
    const r = rec(p, S.grade, S.level, S.stage);
    delete r.at; delete r.atFirst; delete r.atScore; delete r.atTotal; delete r.mAt;   // 這一段寫完了，不用再記寫到哪
    r.best = Math.max(r.best, stars);
    r.bestScore = Math.max(r.bestScore || 0, S.roundScore);
    if (stars >= PASS) { r.cleared = true; r.skipped = false; r.fails = 0; }
    else { r.fails++; R.canSkip = r.fails >= SKIP_AFTER && !passed(r); }
    R.levelClear = !wasLevel && levelDone(p, S.grade, S.level);
    R.gradeBadge = !wasGrade && gradeDone(p, S.grade);
  }
  if (boss) {
    const win = S.bossHP <= 0;
    R.boss = { win, hearts: S.hearts }; R.passedNow = win;
    if (win && !hasBadge(p, S.grade, S.level)) { p.badges = { ...(p.badges || {}), [badgeKey(S.grade, S.level)]: true }; p.coins += BOSS_COINS; R.badgeNew = true; }
  }
  persist(p);
  const lines = [];
  lines.push(boss ? (R.boss.win ? `你打敗${bossOf().name}了！` : `${bossOf().name}好強，再挑戰一次吧！`) : S.mode === 'review' ? '複習完成！' : R.passedNow ? '過關了！' : '差一點點！');
  if (R.badgeNew) lines.push(`拿到${levelInfo(S.level).name}勇者徽章，還有${BOSS_COINS}個金幣！`);
  lines.push(`${stars ? `你得到${CN_NUM[stars]}顆星星` : '這次沒有星星'}，這回合得到${S.roundScore}分${coinsGot ? `，還有${coinsGot}個金幣` : ''}。`);
  if (R.newCards.length) lines.push(`收集了${R.newCards.length}張新字卡。`);
  if (R.dexPage) lines.push(`${CN_NUM[R.dexPage]}年級國字圖鑑集滿了，送你${DEX_REWARD}個金幣！`);
  if (R.levelUp >= 0) lines.push(`升級了！你現在是${TITLES[R.levelUp].name}。`);
  if (R.gradeBadge) lines.push(`恭喜你拿到${CN_NUM[S.grade]}年級破關徽章！`);
  else if (R.levelClear) lines.push('這個關卡全部破關了！');
  if (R.canSkip) lines.push('這一關有點難，可以先跳過喔。');
  R.line = lines.join('');
  S.result = R;
  go('result');
  sfx(boss && R.boss.win ? 'boss' : 'stars', stars);
  if (R.newCards.length || R.chest) setTimeout(() => sfx('magic'), boss && R.boss.win ? 2900 : 2300);   // 新字卡、寶箱：魔法閃爍
  celebrate(R);
  setTimeout(() => narrate(R.line), 1200);
  maybeRest(document.querySelector('.party') ? 4600 : 600);
}

function nextQ() {
  if (S.mode === 'boss' && (S.bossHP <= 0 || S.hearts <= 0)) return finishRound();
  if (hopOn() && S.hop.lost) return finishRound();
  if (S.mode === 'secret' && (S.mix.hp <= 0 || S.mix.over)) return finishRound();
  S.idx++; S.tried = []; S.answered = false; S.bubble = ''; S.timedOut = false;
  if (S.idx >= S.qs.length) return finishRound();
  /* 安親班一段 20～30 題：每答完一題就記住寫到第幾題，中途離開下次從這一題接著寫 */
  if (S.mode === 'stage' && kzParse(S.level)) {
    const p = me(), r = rec(p, S.grade, S.level, S.stage);
    Object.assign(r, { at: S.idx, atFirst: S.firstTry, atScore: S.roundScore, atTotal: S.qs.length });
    persist(p);
  }
  newQTime(); prepQ(S.qs[S.idx]);
  render();
  startTimer(false);
  const nq = S.qs[S.idx];
  if (hopOn() && nq.phase === 'boss' && S.qs[S.idx - 1].phase === 'hop') { showBossIntro(() => askQ(nq), { rule: '答對一題就攻擊一下；答錯會掉一顆愛心（同一題只掉一次）。你有 3 顆愛心！' }); return; }   // 九顆石頭走完：頭目出場
  askQ(nq, nq.golden ? '寶箱題！' : '');
}

/* 答完題要回哪裡：英文回 Unit 列表；複習、指定練習回關卡；其他回地圖 */
const playBack = () => S.subject === 'kz' || String(S.level).startsWith('kz:') ? 'grade'   // 安親班回考卷清單
  : S.subject === 'en' && (S.level === 'e-unit' || S.mode === 'review') ? 'units' : S.mode === 'review' || S.mode === 'assign' ? 'level' : 'map';
function goBack() {
  window.speechSynthesis?.cancel();
  S.tryItem = S.buyArm = null;
  document.querySelectorAll('.dex-modal').forEach(m => m.remove());
  clearTimeout(duelTimer); clearInterval(whackTimer);
  if (S.screen === 'remote') leaveRemote();
  const home = planetOn() ? (me() ? 'grade' : 'players') : 'home';   // 3D 沒有標題頁：回星球（還沒選玩家就是玩家視窗）
  const back = { remote: 'duelSetup', voice: planetOn() ? 'players' : 'home', players: home, newPlayer: 'players', cloudForm: 'players', movePaste: 'players', grade: planetOn() ? home : 'players', level: 'grade', map: 'level', heroes: ['players', 'grade'].includes(S.heroBack) ? S.heroBack : home, shop: S.shopBack || 'grade',
                 dex: S.dexBack || 'grade', report: S.reportBack || 'grade', duelSetup: S.duelBack || 'grade', duel: 'duelSetup',
                 game: playBack(), result: playBack(), units: 'grade' }[S.screen];
  if (S.screen === 'game' && me()) persist(me());   // 中途離開也保留這回合答錯的字
  if (S.screen === 'grade' && S.subject === 'en' && S.enSet) { S.enSet = ''; render(); return; }   // Book 列表 → 英文項目清單
  if (S.screen === 'grade' && !S.hub) { S.hub = true; go('grade'); return; }   // 年級頁、英文項目清單、安親班 → 科目入口
  S.manage = false; S.delArm = null; S.editId = S.newAnimal = S.newColor = null; S.fromGuest = false;
  go(back || home);
}

/* 音樂／音效開關：音符鈕 → 小面板，兩個開關各有圖示和「開／關」字（預設都開，記在 localStorage） */
const SND_IC = {
  music: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.6 20 2.5v12.3a3.2 3.2 0 1 1-2-2.96V6.9l-7 1.35v8.6A3.2 3.2 0 1 1 9 13.9z"/></svg>',
  sfx: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5c.8 0 1.5.7 1.5 1.5v.6A6 6 0 0 1 18 10.5v4l1.8 2.4c.4.5 0 1.3-.6 1.3H4.8c-.6 0-1-.8-.6-1.3L6 14.5v-4a6 6 0 0 1 4.5-5.9V4c0-.8.7-1.5 1.5-1.5ZM9.5 19.6h5a2.5 2.5 0 0 1-5 0Z"/></svg>',
};
const slashIc = svg => svg.replace('</svg>', '<path d="M3.5 3.5l17 17" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>');
const sndBtn = () => `<button class="icon-btn snd-btn" data-act="snd-panel" aria-label="音樂和音效" aria-haspopup="dialog">${SND.music || SND.sfxOn ? SND_IC.music : slashIc(SND_IC.music)}</button>`;
function sndSync() { document.querySelectorAll('.snd-btn').forEach(x => { x.innerHTML = SND.music || SND.sfxOn ? SND_IC.music : slashIc(SND_IC.music); }); }
function sndPanel(anchor) {
  let pop = $('#sndPop');
  if (anchor && pop) { pop.remove(); return; }   // 再點一次音符鈕＝關掉
  if (!pop) { if (!anchor) return; pop = document.createElement('div'); pop.id = 'sndPop'; pop.className = 'snd-pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', '音樂和音效'); document.body.appendChild(pop); }
  const row = (k, on, name) => `<button data-act="snd-${k}" aria-pressed="${on}">${on ? SND_IC[k] : slashIc(SND_IC[k])}<span>${name}</span><b>${on ? '開' : '關'}</b></button>`;
  pop.innerHTML = row('music', SND.music, '背景音樂') + row('sfx', SND.sfxOn, '音效');
  if (anchor) {   // 放在按鈕下面（下面放不下就放上面），左右不超出畫面
    const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
    pop.style.left = Math.round(Math.min(innerWidth - w - 8, Math.max(8, r.left + r.width / 2 - w / 2))) + 'px';
    pop.style.top = Math.round(r.bottom + 10 + h > innerHeight - 8 ? Math.max(8, r.top - 10 - h) : r.bottom + 10) + 'px';
  }
  sndSync();
}

document.addEventListener('click', e => {
  if ($('#sndPop') && !e.target.closest('#sndPop, [data-act="snd-panel"]')) $('#sndPop').remove();   // 點別的地方就收起來
  const b = e.target.closest('[data-act], #backBtn, #sayBtn');
  if (!b || b.disabled) return;
  if (b.dataset.act === 'snd-panel') { sfx('tap'); sndPanel(b); return; }
  if (b.dataset.act === 'snd-music') { SND.setMusic(!SND.music); sndPanel(); return; }
  if (b.dataset.act === 'snd-sfx') { SND.setSfx(!SND.sfxOn); sndPanel(); sfx('tap'); return; }
  if (b.id === 'backBtn') { sfx('tap'); return goBack(); }
  if (b.id === 'sayBtn') return speak(currentSay());
  const act = b.dataset.act;
  if (act === 'theme') { const night = !document.documentElement.classList.contains('night'); applyTheme(night ? 'night' : 'day'); lsSet(THEME_KEY, night ? 'night' : 'day'); themeReset(); sfx(night ? 'night' : 'day'); narrate(night ? '黑夜模式。天上有星星和流星喔！' : '白天模式。'); return; }
  if (act === 'start') { sfx('tap'); go('players'); narrate(currentSay()); }
  else if (act === 'guest') { sfx('tap'); setCur('guest'); const g = me(); ensureWallet(g); persist(g); S.manage = false; S.greet = null; enterGame(); }
  else if (act === 'buddy') { buddyReact(b); }
  else if (act === 'dex') { sfx('tap'); S.dexBack = S.screen; S.dexGrade = S.grade; go('dex'); narrate(currentSay()); }
  else if (act === 'dex-tab') { sfx('tap'); S.dexGrade = +b.dataset.g; render(); }
  else if (act === 'dex-open') { sfx('tap'); openDexCard(b.dataset.ch); }
  else if (act === 'dex-close') { document.querySelectorAll('.dex-modal').forEach(m => m.remove()); window.speechSynthesis?.cancel(); }
  else if (act === 'hero-tab') { sfx('tap'); S.heroTab = b.dataset.t; S.heroPage = 0; render(); }
  else if (act === 'lb-page') { sfx('tap'); S.heroPage = (S.heroPage || 0) + +b.dataset.d; lbFit(); }
  else if (act === 'guest-upgrade') { sfx('tap'); S.fromGuest = true; S.editId = null; S.newColor = S.newAnimal = null; go('newPlayer'); narrate('請大人幫忙輸入 ID，遊客的進度會一起搬過去。'); }
  else if (act === 'heroes') { sfx('tap'); S.heroBack = S.screen; S.heroPage = 0; go('heroes'); narrate(currentSay()); }
  else if (act === 'shop') { sfx('tap'); S.shopBack = S.screen; S.tryItem = S.buyArm = S.shopZoom = null; go('shop'); narrate(currentSay()); }
  else if (act === 'try') { sfx('tap'); S.tryItem = S.shopZoom = b.dataset.id; S.buyArm = null; render(); narrate(SHOP_BY[b.dataset.id].name); }
  else if (act === 'shop-zoom-close') { sfx('tap'); S.shopZoom = null; S.buyArm = null; render(); }
  else if (act === 'buy') {
    const p = me(), it = SHOP_BY[b.dataset.id];
    if (!it || p.owned.includes(it.id) || p.coins < it.price) return;
    if (S.buyArm !== it.id) { S.buyArm = it.id; S.tryItem = it.id; render(); narrate(`要用${it.price}個金幣買${it.name}嗎？再按一次就買。`); return; }
    p.coins -= it.price; p.owned.push(it.id); p.equip[it.slot] = it.id;
    S.buyArm = null; S.tryItem = null; persist(p);
    sfx('coin'); render(); burst(screen.querySelector('.shop-top .pet')); narrate(`買好了！已經幫你穿上${it.name}。`);
  }
  else if (act === 'equip') { const p = me(), it = SHOP_BY[b.dataset.id]; if (it && p.owned.includes(it.id)) { p.equip[it.slot] = it.id; S.tryItem = null; persist(p); sfx('tap'); render(); } }
  else if (act === 'tier-hide') { const p = me(), k = b.dataset.k; if (TIER_GEAR.some(([g]) => g === k)) { const h = new Set(String(p.equip.hide || '').split(',').filter(Boolean)); h.has(k) ? h.delete(k) : h.add(k); const v = cleanHide([...h].join(',')); if (v) p.equip.hide = v; else delete p.equip.hide; persist(p); sfx('tap'); render(); } }
  else if (act === 'unequip') { const p = me(), it = SHOP_BY[b.dataset.id]; if (it) { delete p.equip[it.slot]; S.tryItem = null; persist(p); sfx('tap'); render(); } }
  else if (act === 'player') { sfx('tap'); setCur(b.dataset.id); S.greet = null; enterGame(); }
  else if (act === 'add-player') { sfx('tap'); S.newColor = S.newAnimal = S.editId = null; go('newPlayer'); narrate(currentSay()); }
  else if (act === 'edit') { sfx('tap'); S.editId = b.dataset.id; S.newColor = S.newAnimal = null; go('newPlayer'); }
  else if (act === 'color') { S.newColor = b.dataset.c; screen.querySelectorAll('.swatch').forEach(s => s.setAttribute('aria-pressed', s.dataset.c === S.newColor)); refreshPreview(); }
  else if (act === 'animal') pickAnimal(b.dataset.k);
  else if (act === 'animal-step') { const i = ANIMAL_KEYS.indexOf(S.newAnimal) + +b.dataset.d; if (i >= 0 && i < ANIMAL_KEYS.length) pickAnimal(ANIMAL_KEYS[i]); }
  else if (act === 'manage') { S.manage = !S.manage; S.delArm = null; render(); }
  else if (act === 'cloud-login') { sfx('tap'); S.cf = { mode: 'login' }; go('cloudForm'); narrate('請大人幫忙輸入 ID 和登入序號。'); }

  else if (act === 'cf-skip') { sfx('tap'); nextImport(''); }
  else if (act === 'move-paste') { sfx('tap'); go('movePaste'); }
  else if (act === 'move-read') { sfx('tap'); readMove(); }
  else if (act === 'move-copy') { sfx('tap'); copyMove(); }
  else if (act === 'sync-retry') {
    sfx('tap');
    const p = PLAYERS.find(x => x.id === b.dataset.id);
    if (p) { S.cf = { mode: 'login', id: SYNC[p.id] ? SYNC[p.id].cid : p.name }; go('cloudForm'); }
    else { PLAYERS.forEach(x => { if (synced(x) && SYNC[x.id].err === 'net') SYNC[x.id].err = ''; }); flushSync(); }

    const sub = b.dataset.sub;
    voicePref[sub] = b.dataset.uri; lsSet(VOICE_KEY, JSON.stringify(voicePref)); pickVoice(); render(); speak(VOICE_SAMPLE[sub]);
  }

  else if (act === 'subject') { sfx('enter', b.dataset.s); S.subject = b.dataset.s; S.enSet = ''; S.hub = false; /* 切回英文先看項目清單 */ go('grade'); narrate(S.subject === 'kz' ? '安親班專區。選一份考卷。' : { zh: '國語。', en: '英文。', math: '數學。' }[S.subject] + '你是幾年級？'); }
  else if (act === 'grade') { sfx('tap'); S.grade = +b.dataset.g; go('level'); narrate(`${CN_NUM[S.grade]}年級。選一個關卡。`); }

  else if (act === 'review') { sfx('go'); startReview(); }
  else if (act === 'replay') { speak(S.qs[S.idx].say); }
  else if (act === 'pick') { choose(+b.dataset.i); }
  else if (act === 'seq') { seqTap(b.dataset.i); }
  else if (act === 'key') { padType(b.dataset.d); }

  else if (act === 'again') { sfx('go'); startStage(S.stage); }
  else if (act === 'boss') { sfx('go'); startBoss(); }
  else if (act === 'secret') { sfx('go'); startSecret(); }
  else if (act === 'assign') { sfx('go'); startAssign(); }
  else if (act === 'duel-setup') { sfx('tap'); if (S.screen !== 'duel') S.duelBack = S.screen; S.duel = null; go('duelSetup'); narrate('雙人對戰！選好兩個人，聽到題目誰先點對誰得分。'); }
  else if (act === 'duel-mode') { sfx('tap'); S.duelPick.mode = b.dataset.m; render(); narrate(b.dataset.m === 'remote' ? '各用各的平板！一個人開新房間，另一個人輸入一樣的房間號碼。' : '兩個人一起用這台平板比賽。'); }
  else if (act === 'r-host') { sfx('tap'); const code = String(1000 + Math.floor(Math.random() * 9000)); remoteOpen('host', code); narrate(`房間開好了！房間號碼是${code.split('').join('，')}。把號碼告訴朋友。`); }
  else if (act === 'r-enter') { sfx('tap'); leaveRemote(); R = { entering: true, typed: '' }; go('remote'); narrate('請輸入朋友告訴你的四個數字。'); }
  else if (act === 'r-key') { if (R && R.entering && R.typed.length < 4) { sfx('tap'); R.typed += b.dataset.d; render(); } }
  else if (act === 'r-del') { if (R && R.entering) { sfx('tap'); R.typed = R.typed.slice(0, -1); render(); } }
  else if (act === 'r-go') { if (R && R.entering && /^\d{4}$/.test(R.typed)) { sfx('tap'); const code = R.typed; R = null; remoteOpen('guest', code); } }
  else if (act === 'r-start' || act === 'r-again') { if (R && R.role === 'host') { sfx('tap'); rHostStart(); } }
  else if (act === 'r-pick') { rPick(+b.dataset.i); }
  else if (act === 'r-replay') { if (R && R.st && R.st.q && R.st.phase === 'q') rSpeakQ(); }
  else if (act === 'r-leave') { sfx('tap'); leaveRemote(); go('duelSetup'); }
  else if (act === 'duel-who') { sfx('tap'); S.duelPick[b.dataset.side] = b.dataset.id; render(); }
  else if (act === 'duel-grade') { sfx('tap'); if (b.dataset.side) S.duelPick['g' + b.dataset.side] = +b.dataset.g; else S.duelPick.g = +b.dataset.g; render(); }
  else if (act === 'duel-sub') { sfx('tap'); S.duelPick.sub = b.dataset.s; render(); narrate({ zh: '國語對戰', en: '英文對戰', math: '數學對戰' }[b.dataset.s]); }
  else if (act === 'duel-start') { sfx('go'); startDuel(); }
  else if (act === 'duel-pick') { duelPick(b.dataset.side, +b.dataset.i); }
  else if (act === 'duel-replay') { const d = S.duel; if (d && !d.over) speak(d.qa[d.idx].say); }
  else if (act === 'report') { sfx('tap'); S.reportBack = S.screen; go('report'); }
  else if (act === 'asg-clear') { const p = me(); delete p.assign; persist(p); render(); }
  else if (act === 'hard-review') {
    const p = me(); let n = 0;
    Object.entries(p.stats || {}).filter(([, s]) => s.w > 0).sort((a, b) => b[1].w - a[1].w).slice(0, 10).forEach(([ch]) => {
      const w = BANK.find(x => x.字 === ch); if (!w) return;
      const L = reviewList(p, w.年級);
      if (!L.some(r => r.ref === ch)) { L.push({ lv: 'zhuyin', ref: ch, ok: 0 }); n++; }
    });
    persist(p); b.textContent = n ? `已加入 ${n} 個字到錯字複習` : '這些字已經在錯字複習裡了'; b.disabled = true;
  }
  else if (act === 'nextStage') { sfx('go'); startStage(S.level === 'e-unit' ? nextUnit(S.grade, S.stage) : S.stage + 1); }
  else if (act === 'enset') { sfx('tap'); S.enSet = b.dataset.id; render(); narrate(`«${(EN_SETS.find(x => x.id === S.enSet) || {}).name || ''}»。選一冊。`); }
  else if (act === 'book') { sfx('tap'); S.grade = +b.dataset.g; S.level = 'e-unit'; go('units'); narrate(currentSay()); }
  else if (act === 'unit') { sfx('go'); S.level = 'e-unit'; startStage(+b.dataset.i); }
  else if (act === 'skip') {
    const r = rec(me(), S.grade, S.level, S.stage); r.skipped = true; r.fails = 0; persist(me());
    go('map'); narrate('沒關係，先去下一關，之後再回來挑戰！');
  }
  else if (act === 'toMap') { sfx('tap'); go(String(S.level).startsWith('kz:') ? 'grade' : S.level === 'e-unit' ? 'units' : 'map'); }
  else if (act === 'toLevel') { sfx('tap'); go(S.subject === 'kz' ? 'grade' : S.subject === 'en' ? 'units' : 'level'); }
  else if (act === 'paper') { sfx('go'); const pp = KZ.find(x => x.id === b.dataset.id); if (pp) { S.subject = 'kz'; S.grade = pp.年級; S.level = 'kz:' + pp.id; startStage(kzResume(me(), pp)); } }
  else if (act === 'mpick') { kzMatchPick(b.dataset.side, +b.dataset.k); }
  else if (act === 'paper-hard') { sfx('go'); const pp = KZ.find(x => x.id === b.dataset.id); if (pp && (kzIsMatch(pp) ? kzMissList(me(), pp).length : kzHardItems(pp).length)) { S.subject = 'kz'; S.grade = pp.年級; S.level = 'kz:' + pp.id + ':hard'; startStage(0); } }
  else if (act === 'kz-isle') { sfx('go'); const pp = KZ.find(x => x.id === b.dataset.id), i = +b.dataset.i; if (pp && i >= 0 && i < kzSegments(pp).length) { S.subject = 'kz'; S.grade = pp.年級; S.level = 'kz:' + pp.id; startStage(i); } }   // 點一座島＝寫那一段（不用照順序）
  else if (act === 'kz-sea') { sfx('tap'); S.kzSeaSel = { ...(S.kzSeaSel || {}), [S.kzSub + '|' + (S.kzCat || '')]: b.dataset.id }; render(); }
  else if (act === 'pl-players') { sfx('tap'); S.manage = false; S.delArm = null; go('players'); narrate(currentSay()); }   // 星球上的「目前玩家」：換玩家
  else if (act === 'pl-close') { sfx('tap'); S.manage = false; S.delArm = null; S.hub = true; go(me() ? 'grade' : 'players'); }
  else if (act === 'say-now') { speak(currentSay()); }
  else if (act === 'planet-mode') {   // 3D 星球打不開時的「再試一次 3D」
    sfx('tap'); if (PL.state === 'fail') PL.state = ''; narrate('3D 星球。'); render();
  }
  else if (act === 'kz-view') { sfx('tap'); S.kzView = kzViewList() ? 'map' : 'list'; lsSet('zizi-kz-view', S.kzView); render(); }
  else if (act === 'kz-boat') { sfx('tap'); kzBoatParty(S.kzSub); }
  else if (act === 'kz-sub') { sfx('tap'); S.kzSub = b.dataset.s; render(); }
  else if (act === 'kz-cat') { sfx('tap'); S.kzCat = b.dataset.s; render(); }
});

/* ---------- 啟動 ---------- */
function checkBank() {
  BANK.forEach(w => {
    const p = parseZy(w.注音);
    if (p.tone !== w.聲調) console.warn('聲調欄位和注音不一致：', w.字, w.注音, w.聲調);
    (w.常見錯字 || []).forEach(e => {
      const a = [...e.正確], b = [...e.錯誤];
      if (a.length !== b.length || a.filter((c, i) => c !== b[i]).length !== 1) console.warn('常見錯字要剛好差一個字：', w.字, e);
    });
  });
}
/* 開機畫面交棒：星球已經畫上去（同一片天空、同一個「星球準備中…」），拿掉開機畫面；天空底多留一下，等星球的天空圖貼好 */
function bootDone() {
  const r = document.documentElement, b = document.getElementById('boot');
  if (b) b.remove();
  if (!r.classList.contains('boot3d')) return;
  const off = () => { r.classList.remove('boot3d', 'boot-poster'); r.style.removeProperty('--poster'); };   // 島嶼畫面（很長的圖片字串）用完就拿掉
  if (!document.body.classList.contains('pl-full')) { off(); return; }
  setTimeout(off, 400);   // 不用 requestAnimationFrame：分頁在背景時它不會跑
}
async function start(saved) {
  try { planetWarm(); } catch (e) { /* 3D 預先下載失敗不影響遊戲 */ }
  try {
    const res = await fetch('words.json', { cache: 'no-cache' });
    DATA = await res.json();
  } catch (e) {
    bootDone();
    screen.innerHTML = `<p class="notice">字庫讀不到（words.json）。請確認它和這個網頁放在同一個資料夾。</p>`;
    return;
  }
  BANK = DATA['字庫'] || [];
  /* Wordly Wise 3000 的資料冊是 1～6，讀進來改成 101～106 */
  const ww = (rows, b = 0) => (rows || []).map(x => ({ ...x, 冊: +x.冊 + b }));
  EN = [...ww(DATA['英文字庫']), ...ww(DATA['WW3000字庫'], WW)].filter(w => w && w.英文 && w.中文 && w.冊 && w.課).map(w => ({ ...w, 冊: +w.冊, 課: +w.課, 年級: w.冊 > WW ? w.冊 - WW : +w.冊, 圖: emojiPic(w.圖 || '') }));
  SENT = (DATA['英文句子'] || []).filter(s => s && s.句子 && s.句子.includes('___') && s.答案 && (s.錯誤選項 || []).length >= 2 && s.年級);
  SENT4 = [...ww(DATA['英文4000句子']), ...ww(DATA['WW3000句子'], WW)].filter(s => s && s.句子 && s.句子.includes('___') && s.答案 && (s.錯誤選項 || []).length >= 3 && s.冊 && s.課).map(s => ({ ...s, 冊: +s.冊, 課: +s.課 }));
  SENT_BY = new Map(SENT4.map(s => [`${s.冊}|${s.課}|${s.答案}`, s]));
  DEF4 = [...ww(DATA['英文4000英英']), ...ww(DATA['WW3000英英'], WW)].filter(s => s && s.解釋 && s.答案 && (s.錯誤選項 || []).length >= 3 && s.冊 && s.課).map(s => ({ ...s, 冊: +s.冊, 課: +s.課 }));
  DEF_BY = new Map(DEF4.map(s => [`${s.冊}|${s.課}|${s.答案}`, s]));
  KZ = (DATA['安親班'] || []).filter(p => p && p.id && ((Array.isArray(p.題) && p.題.length) || (p.類型 === '配對' && Array.isArray(p.組) && p.組.some(g => (g.配對 || []).length >= 2))))
    .map(p => ({ ...p, 題: (p.題 || []).filter(t => t && t.題目 && Array.isArray(t.選項) && t.選項.includes(t.答案)),
                 組: p.類型 === '配對' ? p.組.map(g => ({ ...g, 配對: (g.配對 || []).filter(x => x && x.成語 && x.意思) })).filter(g => g.配對.length >= 2) : p.組 }));
  checkBank();
  if (saved && saved.S && saved.S.screen) Object.assign(S, saved.S);
  if (S.screen === 'game' && !S.qs.length) S.screen = 'home';
  if (S.screen === 'home' && planetOn()) { S.screen = me() ? 'grade' : 'players'; S.hub = true; }   // 3D：一打開就是星球地圖，記得上次的玩家就直接用
  render();
  bootDone();
  if (S.screen === 'game' && !S.answered) startTimer(false);   // 網頁更新後接著原本的秒數倒數
  connectCloud();
  siteCloud();
}
window.claude?.hot?.snapshot?.(() => ({ S: clone(S) }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
