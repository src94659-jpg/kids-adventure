<style>
/* 版面：一個畫面只做一件事。上方工具列、中間題目、下方大按鈕；生字簿的田字格是視覺主角。
   刻意只做亮色版：給小朋友的明亮教室感，所有顏色都明確指定，不受系統深色模式影響。 */
:root {
  --bg: #E9F3EA;        /* 淡淡的葉綠，像作業簿封面 */
  --paper: #FFFDF7;     /* 生字簿紙 */
  --ink: #1F3A2C;       /* 深綠墨色 */
  --muted: #5D7467;
  --line: #CADDCF;
  --grid: #E08A86;      /* 田字格紅線 */
  --sun: #F6B12F;       /* 星星、主按鈕 */
  --sun-deep: #C98510;
  --sun-soft: #FFF1CF;
  --sky: #2F7DBF;       /* 喇叭、聲音 */
  --sky-deep: #1F5E94;
  --sky-soft: #DDEBF7;
  --leaf: #3C9A66;      /* 答對、過關 */
  --leaf-soft: #DCF1E3;
  --coral: #D9665F;
  --coral-soft: #F8E0DE;
  --owl: #B97A45;
  --owl-dark: #8E5A2E;
  --owl-belly: #F4DCB6;
  --kai: "TW-Kai", "BiauKai", "DFKai-SB", "標楷體", "Kaiti TC", "Noto Serif TC", serif;
  --en: "Arial Rounded MT Bold", "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --ui: "Huninn", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  color-scheme: light;
  /* 全遊戲字級放大：改 --fs 一個數字就能整體調整。小字（≤1rem）全額放大、中字（≤1.5rem）放 3/4、
     大字（≤2.4rem）放 2/5，更大的標題和田字格大字不放大；再加最小字級（手機 14px、平板 16px）。 */
  --fs: 1.2;
  --fs-s: var(--fs);
  --fs-m: calc(1 + (var(--fs) - 1) * .75);
  --fs-l: calc(1 + (var(--fs) - 1) * .4);
  --fs-min: 14px;
}
@media (min-width: 700px) and (min-height: 700px) { :root { --fs-min: 16px; } }
/* 題目太長放不下時（fsFit）：先退一半，再退回原本大小 */
.fs1 { --fs-s: calc(1 + (var(--fs) - 1) * .5); --fs-m: calc(1 + (var(--fs) - 1) * .4); --fs-l: calc(1 + (var(--fs) - 1) * .2); --fs-min: 13px; }
.fs2 { --fs-s: 1; --fs-m: 1; --fs-l: 1; --fs-min: 0px; }
.fs1, .fs2 { font-size: max(var(--fs-min), 1rem * var(--fs-s)); }   /* 沒有自己字級的字（繼承 body 的）也一起退 */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: radial-gradient(var(--line) 1.2px, transparent 1.4px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--ui);
  font-size: max(var(--fs-min), 1rem * var(--fs-s));   /* 沒有自己字級的文字（按鈕、說明）也一起放大 */

  overscroll-behavior: none;
}

  max-width: 760px;

.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 4px; min-height: 76px; }
.bar h2 { margin: 0; font-size: max(var(--fs-min), clamp(1.15rem, 4.6vw, 1.5rem) * var(--fs-m)); font-weight: 400; text-align: center; flex: 1; min-width: 0; text-wrap: balance; }

  display: grid; place-items: center;
  border-radius: 50%; border: 3px solid var(--line); background: var(--paper);

.icon-btn svg { width: 30px; height: 30px; }

.stack { display: flex; flex-direction: column; align-items: center; gap: 18px; }

.home .pet { width: min(42vw, 180px); }
.logo { margin: 0; font-family: var(--kai); font-size: clamp(2.6rem, 12vw, 4.2rem); letter-spacing: .08em; line-height: 1.1; }
.logo span { color: var(--sky-deep); }
.tag { margin: 0; color: var(--muted); font-size: max(var(--fs-min), 1.15rem * var(--fs-m)); }
.btn-big {

}
.btn-big:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--sun-deep); }

.btn-big.go { background: var(--leaf); color: #fff; box-shadow: 0 7px 0 #2A7049; }
.btn-small { min-height: 48px; padding: 8px 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); font-size: max(var(--fs-min), 1rem * var(--fs-s)); }
.btn-small.danger { border-color: var(--coral); color: #A8443E; }
.adult { color: var(--muted); font-size: max(var(--fs-min), .95rem * var(--fs-s)); margin: 10px 0 0; }
.adult a, .link-btn { color: inherit; text-decoration: underline; text-underline-offset: 3px; }
.link-btn { border: 0; background: none; padding: 6px 4px; font-size: inherit; }
.voice-page { gap: 14px; max-width: 640px; margin: 0 auto; }
.voice-sec { width: 100%; }
.voice-sec h3 { margin: 0 0 8px; font-size: max(var(--fs-min), 1.15rem * var(--fs-m)); font-weight: 400; text-align: center; }
.voice-opt em { font-style: normal; font-size: max(var(--fs-min), .75rem * var(--fs-s)); margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--leaf-soft); color: var(--leaf); }
.notice { background: var(--sun-soft); border: 2px dashed var(--sun); border-radius: 16px; padding: 10px 14px; font-size: max(var(--fs-min), .95rem * var(--fs-s)); max-width: 30em; text-align: left; margin: 0; }
.save-note { color: var(--muted); font-size: max(var(--fs-min), .95rem * var(--fs-s)); margin: 0; text-align: center; }
.save-note b { font-weight: 400; color: var(--leaf); }

/* 卡片 */
.cards { display: grid; gap: 16px; width: 100%; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.card {
  position: relative;
  display: flex; align-items: center; gap: 16px;
  min-height: 112px; padding: 16px 18px;
  text-align: left;
  border: 3px solid var(--line); border-radius: 24px; background: var(--paper);
  box-shadow: 0 6px 0 var(--line);
  transition: transform .08s;
}
button.card:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.card:disabled { opacity: .5; cursor: default; box-shadow: none; }
.card .num {

  font-family: var(--kai); font-size: 2.8rem; border-radius: 18px;

.card .num svg { width: 40px; height: 40px; }
.card .num .duo { font-size: .56em; white-space: nowrap; letter-spacing: -.02em; line-height: 1; }   /* 兩個字的圖示排成一行、留在框內 */
.card .num .pet { width: 70px; }
.card .txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .name { font-size: max(var(--fs-min), 1.45rem * var(--fs-m)); overflow-wrap: anywhere; }
.card .desc { color: var(--muted); font-size: max(var(--fs-min), 1rem * var(--fs-s)); }
/* 英文 Unit 1～30 的格子：平板 6 欄 × 5 列，手機 5 欄 × 6 列 */
.unit-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; width: 100%; max-width: 640px; }
.unit { min-height: 66px; padding: 4px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 3px solid var(--line); border-radius: 16px; background: var(--paper); box-shadow: 0 4px 0 var(--line); }
.unit b { font-family: var(--en); font-weight: 700; font-size: max(var(--fs-min), 1.45rem * var(--fs-m)); line-height: 1; color: var(--sky-deep); }
.unit small { font-size: max(var(--fs-min), .78rem * var(--fs-s)); color: var(--muted); line-height: 1.1; }

.unit { position: relative; }
.unit .wrong-n { position: absolute; top: -8px; right: -6px; font-style: normal; font-size: max(var(--fs-min), .68rem * var(--fs-s)); line-height: 1; padding: 3px 5px; border-radius: 99px; background: var(--coral); color: #fff; box-shadow: 0 1px 0 rgba(0, 0, 0, .15); }   /* 這一課還有幾題錯題 */
.unit.done { border-color: var(--leaf); background: var(--leaf-soft); }
:root.night .unit b { color: #8EC5F5; }

.unit:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
@media (max-width: 560px) { .unit-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; } .unit { min-height: 56px; } .unit b { font-size: max(var(--fs-min), 1.2rem * var(--fs-m)); } }
/* ---------- 安親班專區：考卷題目（不倒數、答完一定有解說） ---------- */
.stack.kz-game { gap: 10px; }
.kz-head { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
.kz-part { background: var(--sky); color: #fff; border-radius: 99px; padding: 2px 14px; font-size: max(var(--fs-min), .95rem * var(--fs-s)); }
.kz-no { color: var(--muted); font-size: max(var(--fs-min), .85rem * var(--fs-s)); }
.kz-q { width: 100%; max-width: 640px; background: rgba(255, 253, 247, .94); border: 3px solid var(--line); border-radius: 20px; padding: 10px 16px; font-size: max(var(--fs-min), min(1.45rem, 4.8vw, 3.3vh) * var(--fs-m)); line-height: 1.5; text-align: left; }
.kz-q { white-space: pre-line; }   /* 題目裡的換行（短文、改錯字的句子和問題分兩行）照樣換行 */
.kz-q.sm { font-size: max(var(--fs-min), min(1.25rem, 4.3vw, 2.9vh) * var(--fs-m)); }
.kz-q.g1 { font-size: max(var(--fs-min), min(1.75rem, 6vw, 3.8vh) * var(--fs-l)); text-align: center; }   /* 小一：題目字大一點 */
/* 國中英文題：英文字型；題目、選項平板 ≥ 22px、手機 ≥ 18px，長題目（引用一段話）也不縮 */
.kz-q.en { font-family: var(--en); font-size: max(var(--fs-min), min(1.5rem, 4.9vw, 3.2vh) * var(--fs-m)); line-height: 1.4; }
.kz-opts.kz-opts.en .opt.kzopt, .kz-done .kz-opts.kz-long.en .opt.kzopt { font-family: var(--en); font-size: max(var(--fs-min), min(1.4rem, 4.8vw, 3vh) * var(--fs-m)); line-height: 1.3; }
.kz-done .kz-opts.kz-long.en .opt.kzopt { min-height: 0; padding: 4px 12px; }   /* 答完多了解說：長題目（第 20 題）選項變矮，字不縮 */
.kz-done .kz-opts.kz-long.en { gap: 6px; }
.kz-done .kz-q.en { line-height: 1.3; }
@media (min-width: 700px) and (max-height: 900px) { .kz-done .kz-opts.kz-long.en { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 640px; } }   /* 平板橫放：答完英文長選項排兩欄，解說才放得下 */
.kz-q.xs { font-size: max(var(--fs-min), min(1.1rem, 3.9vw, 2.6vh) * var(--fs-m)); line-height: 1.45; }
.vbox { display: block; width: .82em; height: 1em; margin: .1em auto; border: 3px solid var(--sky); border-radius: 6px; background: var(--paper); }
.vbox.in { display: inline-block; width: .9em; height: 1em; margin: 0 2px; vertical-align: -.15em; border-width: 2px; border-radius: 4px; }
.vert { display: grid; grid-template-columns: repeat(var(--n), 1.25em); justify-content: center; align-items: center; text-align: center; font-family: var(--en); font-variant-numeric: tabular-nums; font-size: max(var(--fs-min), min(2.1rem, 7vw, 4.4vh) * var(--fs-l)); line-height: 1.25; padding: 6px 18px; background: rgba(255, 253, 247, .94); border: 3px solid var(--line); border-radius: 18px; }
.vert .vline { grid-column: 1 / -1; height: 3px; margin: 3px 0; background: var(--ink); border-radius: 2px; }
.route { width: min(100%, 420px); max-height: 25vh; background: var(--paper); border: 3px solid var(--line); border-radius: 18px; }
.route .rt-road { stroke: var(--sky); stroke-width: 5; stroke-linecap: round; }
.route .rt-node { fill: var(--sun-soft); stroke: var(--sun-deep); stroke-width: 2; }
.route .rt-name { font-size: calc(15px * var(--fs-s)); text-anchor: middle; fill: var(--ink); font-family: var(--ui); }
.route .rt-dist { font-size: calc(14px * var(--fs-s)); font-weight: 700; text-anchor: middle; fill: var(--ink); font-family: var(--ui); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.kz-opts { max-width: 560px; gap: 10px; }
.kz-opts .opt.kzopt { font-size: max(var(--fs-min), min(1.5rem, 4.8vw, 3.4vh) * var(--fs-m)); min-height: min(62px, 7.5vh); }
.kz-opts.kz-cmp .opt.kzopt { font-size: max(var(--fs-min), min(2.4rem, 8vw, 5vh) * var(--fs-l)); }   /* ＞＜＝ 大一點 */
.kz-opts.kz-tf .opt.kzopt { font-size: max(var(--fs-min), min(2.2rem, 7.4vw, 4.6vh) * var(--fs-l)); }   /* 是非題「對／錯」兩顆大按鈕 */
.kz-opts.kz-zy .opt.kzopt { font-size: max(var(--fs-min), min(2rem, 6.4vw, 4.2vh) * var(--fs-l)); letter-spacing: .04em; word-spacing: .5em; white-space: nowrap; }   /* 選項全是注音時放大，聲調符號才看得清楚；兩個音節中間空開一點 */

/* 選夥伴：左右滑（或滾滑鼠滾輪、按兩邊箭頭）的轉盤，停在正中間的就是選到的，放大顯示 */
.ani-wheel { --aw: 44px; --gap: 4px; --cw: 100px; container-type: inline-size; width: min(640px, calc(100vw - 32px)); align-self: center; display: flex; align-items: center; gap: var(--gap); }

  padding: 26px calc((100cqw - 2 * var(--aw) - 2 * var(--gap)) / 2 - var(--cw) / 2);   /* 左右留白讓第一個和最後一個也能轉到正中間；上下留白給放大的那張 */
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }

/* 田字格 */
.tzg {
  position: relative; display: grid; place-items: center;
  width: min(44vw, 24vh, 200px); aspect-ratio: 1; max-width: 100%; flex: none;
  background: var(--paper); border: 3px solid var(--grid);

}

.tzg::before { left: 50%; top: 0; bottom: 0; border-left: 2px dashed var(--grid); opacity: .55; }
.tzg::after { top: 50%; left: 0; right: 0; border-top: 2px dashed var(--grid); opacity: .55; }
.tzg > span { position: relative; z-index: 1; }
.example { font-size: max(var(--fs-min), min(1.5rem, 3.4vh) * var(--fs-m)); letter-spacing: .1em; margin: 0; }
.example b { color: var(--sky-deep); font-weight: 400; border-bottom: 4px solid var(--sun); }

.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: 100%; max-width: 480px; }
.opts.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.opt {
  min-height: clamp(54px, 10vh, 96px); padding: 6px;
  border: 3px solid var(--line); border-radius: 22px; background: var(--paper);
  box-shadow: 0 6px 0 var(--line);
  display: grid; place-items: center;
  transition: transform .08s, opacity .25s, background .25s;
}
.opt:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
.opt.char { font-family: var(--kai); font-size: min(3.6rem, 11vw, 6.5vh); line-height: 1; }
.opt.zy { font-size: max(var(--fs-min), min(2.3rem, 7vw, 4.4vh) * var(--fs-l)); letter-spacing: .06em; }
.opt.tried { opacity: .32; box-shadow: none; transform: translateY(4px); }
.opt.right, .tile.right { background: var(--leaf-soft); border-color: var(--leaf); box-shadow: 0 6px 0 var(--leaf); }
.opt.shake, .tile.shake { animation: shake .4s; }
.opt.pop, .tile.pop { animation: pop .45s; }

.tiles { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.tile {
  position: relative; width: min(28vw, 18vh, 124px); aspect-ratio: 1; padding: 0;
  display: grid; place-items: center;
  font-family: var(--kai); font-size: min(21vw, 13vh, 88px); line-height: 1;
  background: var(--paper); border: 3px solid var(--grid); border-radius: 6px;
  box-shadow: 0 6px 0 var(--line);
}
.tile::before, .tile::after { content: ""; position: absolute; pointer-events: none; opacity: .45; }
.tile::before { left: 50%; top: 0; bottom: 0; border-left: 2px dashed var(--grid); }
.tile::after { top: 50%; left: 0; right: 0; border-top: 2px dashed var(--grid); }
.tile > span { position: relative; z-index: 1; }
.tile.tried { opacity: .4; box-shadow: none; }
.tile.blank { border-style: dashed; border-color: var(--sky); background: var(--sky-soft); color: var(--sky-deep); }
.tile.static { box-shadow: none; }

.coach { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 480px; min-height: min(76px, 9vh); }
.coach .pet { width: min(70px, 9vh); flex: none; }
.btn-next {
  flex: none; min-height: 60px; padding: 8px 20px;
  border: none; border-radius: 999px; background: var(--sun); color: var(--ink);
  font-size: max(var(--fs-min), 1.3rem * var(--fs-m)); letter-spacing: .08em; box-shadow: 0 6px 0 var(--sun-deep);
  animation: pop .45s;
}
.btn-next:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--sun-deep); }
.bubble {
  position: relative; flex: 1; min-width: 0;
  background: var(--paper); border: 3px solid var(--line); border-radius: 18px;
  padding: 8px 12px; font-size: max(var(--fs-min), min(1.2rem, 2.6vh, 4.6vw) * var(--fs-m));
}
.bubble::before {
  content: ""; position: absolute; left: -11px; top: 50%; margin-top: -9px;
  border: 9px solid transparent; border-right-color: var(--line); border-left: 0;
}
.next-row { min-height: 80px; display: grid; place-items: center; }

/* 結算 */
.result { text-align: center; justify-content: center; min-height: 100%; gap: clamp(6px, 1.4vh, 14px); }
.big-stars { display: flex; gap: 10px; justify-content: center; }
.big-stars svg { width: min(22vw, 10vh, 92px); height: auto; }
.result .btn-big { min-height: min(72px, 8.5vh); padding-block: 8px; font-size: max(var(--fs-min), min(1.6rem, 3.4vh) * var(--fs-l)); }
.result p { font-size: max(var(--fs-min), min(1.2rem, 2.6vh) * var(--fs-m))!important; }
.result h2 { font-size: max(var(--fs-min), min(2rem, 4.4vh) * var(--fs-l))!important; }
.big-stars .s { fill: var(--line); transform-origin: 50% 50%; transform-box: fill-box; }
.big-stars .on .s { fill: var(--sun); animation: starIn .5s both; }
.big-stars .on:nth-child(2) .s { animation-delay: .35s; }
.big-stars .on:nth-child(3) .s { animation-delay: .7s; }
.result h2 { margin: 0; font-size: max(var(--fs-min), 2rem * var(--fs-l)); font-weight: 400; }
.result p { margin: 0; font-size: max(var(--fs-min), 1.2rem * var(--fs-m)); color: var(--muted); }
.gain { color: var(--sun-deep) !important; }
.celebrate { width: 100%; max-width: 440px; padding: 14px 16px; border-radius: 20px; background: var(--sun-soft); border: 3px solid var(--sun); font-size: max(var(--fs-min), 1.25rem * var(--fs-m)); animation: pop .6s 1s both; }
.celebrate.green { background: var(--leaf-soft); border-color: var(--leaf); }
.celebrate b { font-weight: 400; color: var(--sky-deep); }
.btn-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; padding-top: 6px; }

/* 吉祥物 */
.pet { width: 120px; height: auto; overflow: visible; }
.result .pet { width: min(34vw, 15vh, 140px); }
@media (max-width: 560px) {   /* 手機：寶箱、升級、新字卡都有時也要一個畫面放得下 */
  .result { gap: 6px; padding-block: 0; overflow-x: clip; overflow-clip-margin: 6px; }   /* 寶箱框跳出來放大那一下不會撐出橫向捲軸 */
  .result .pet { width: min(24vw, 10vh, 92px); }
  .big-stars svg, body.v3d .result .big-stars > span { width: min(15vw, 7vh, 60px); }
  .result h2 { font-size: max(var(--fs-min), min(1.6rem, 3.6vh) * var(--fs-l))!important; }
  .result p { font-size: max(var(--fs-min), min(.98rem, 2.3vh) * var(--fs-s))!important; line-height: 1.35; }
  .score-line b { font-size: max(var(--fs-min), 1.2rem * var(--fs-m)); }
  .celebrate { padding: 5px 10px; font-size: max(var(--fs-min), 1rem * var(--fs-s)); border-radius: 14px; border-width: 2px; }
  .result .celebrate .cele-ic { width: 28px; height: 28px; }
  .result .btn-row { gap: 8px; padding-top: 2px; width: 100%; }
  .result .btn-row .btn-big { flex: 1 1 40%; min-height: 48px; padding: 4px 10px; font-size: max(var(--fs-min), 1.15rem * var(--fs-m)); letter-spacing: .04em; }
  .result .btn-row .btn-big.go { flex-basis: 100%; }
}
@media (min-width: 561px) and (max-height: 820px) {   /* 平板橫放：寶箱和升級同時出現也不用捲 */
  .result { padding-block: 0; }
  .result .pet { width: min(34vw, 11vh, 140px); }
  .big-stars svg, body.v3d .result .big-stars > span { width: min(22vw, 8vh, 92px); }
  .celebrate { padding: 6px 14px; font-size: max(var(--fs-min), 1.1rem * var(--fs-m)); }
  .result .celebrate .cele-ic { width: 32px; height: 32px; }
}
.pet .body { fill: var(--owl); }
.pet .wing { fill: var(--owl-dark); }
.pet .belly { fill: var(--owl-belly); }
.pet .eye { fill: #fff; }
.pet .pupil { fill: var(--ink); }
.pet .beak, .pet .foot { fill: var(--sun); }
.pet .glass { fill: none; stroke: var(--ink); stroke-width: 3; }
.pet .cap { fill: var(--ink); }
.pet .tassel { fill: none; stroke: var(--sun); stroke-width: 3; stroke-linecap: round; }
.pet .pom { fill: var(--paper); }
.pet.happy { animation: hop .6s ease; }
.pet.think { animation: tilt .6s ease; }

#fx { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
.spark { position: absolute; font-size: 28px; color: var(--sun); animation: fly .9s ease-out forwards; text-shadow: 0 2px 0 var(--sun-deep); }

/* 英雄榜 */
.hero-btn svg { width: 1.3em; height: 1.3em; vertical-align: -0.25em; margin-right: 4px; }
.hero-head { display: flex; align-items: center; gap: 10px; }
.hero-head svg { width: 56px; height: 56px; }
.hero-head h1 { margin: 0; font-family: var(--kai); font-size: max(var(--fs-min), 2.4rem * var(--fs-l)); font-weight: 400; letter-spacing: .1em; }
.hero-head span { color: var(--muted); white-space: nowrap; }
.heroes.empty { min-height: 100%; justify-content: center; }
.heroes .notice { text-wrap: pretty; }   /* 還沒人上榜：內容放畫面中間，不要全擠在上面 */
@media (max-width: 560px) {
  .hero-head { flex-wrap: wrap; justify-content: center; row-gap: 0; }
  .hero-head h1 { white-space: nowrap; font-size: max(var(--fs-min), 2rem * var(--fs-l)); letter-spacing: .06em; }
  .hero-head span { flex-basis: 100%; text-align: center; }
}
.hero-list { list-style: none; margin: 0; padding: 0; width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 8px; }
.hero-row {
  display: grid; grid-template-columns: 44px 56px minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 6px 14px 6px 8px; border-radius: 20px; background: var(--paper); border: 3px solid var(--line);
}
.hero-row.mine { border-color: var(--sky); background: var(--sky-soft); }
.rank { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: max(var(--fs-min), 1.3rem * var(--fs-m)); border: 3px solid var(--line); background: var(--paper); font-variant-numeric: tabular-nums; }
.hero-pet .pet { width: 54px; }
.hero-txt { display: flex; flex-direction: column; min-width: 0; }
.hero-name { font-size: max(var(--fs-min), 1.25rem * var(--fs-m)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero-name em { font-style: normal; font-size: max(var(--fs-min), .8rem * var(--fs-s)); margin-left: 6px; padding: 1px 8px; border-radius: 99px; background: var(--sky); color: #fff; vertical-align: 2px; }
.hero-title { font-size: max(var(--fs-min), .9rem * var(--fs-s)); color: var(--muted); }
.hero-score { text-align: right; color: var(--muted); white-space: nowrap; }
.hero-score b { font-size: max(var(--fs-min), 1.4rem * var(--fs-m)); font-weight: 400; color: var(--sun-deep); margin-right: 2px; font-variant-numeric: tabular-nums; }

.guardian .party-card h2 { font-size: max(var(--fs-min), 1.8rem * var(--fs-l)); }
.guardian .party-card p { font-size: max(var(--fs-min), 1.2rem * var(--fs-m)); line-height: 1.6; }
.party-card .pair { display: flex; align-items: flex-end; justify-content: center; gap: 4px; }

/* 夥伴說話 */
.buddy-say { width: 100%; max-width: 560px; position: relative; padding: 8px 14px; background: var(--paper); border: 3px solid var(--sky); border-radius: 18px; font-size: max(var(--fs-min), 1.1rem * var(--fs-m)); }
.buddy-say::before { content: ""; position: absolute; left: 28px; top: -12px; border: 9px solid transparent; border-bottom-color: var(--sky); border-top: 0; }
.buddy-btn { border: none; background: none; padding: 0; flex: none; }
.buddy-btn .pet { width: 60px; }
.home .buddy-btn .pet { width: min(42vw, 180px); }

/* 國字圖鑑 */
.dex-tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.dex-tabs button[aria-pressed="true"], .duel-grades button[aria-pressed="true"] { background: var(--sky); border-color: var(--sky-deep); color: #fff; }
.duel-col.red .duel-grades button[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); }
.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; width: 100%; max-width: 560px; }
.dex-card { aspect-ratio: 3 / 4; border-radius: 14px; border: 3px solid var(--line); background: var(--paper); display: grid; place-items: center; align-content: center; gap: 2px; padding: 4px; }
.dex-card b { font-family: var(--kai); font-weight: 400; font-size: max(var(--fs-min), 2rem * var(--fs-l)); line-height: 1; }
.dex-card small { font-size: max(var(--fs-min), .75rem * var(--fs-s)); color: var(--muted); }
.dex-card.locked { background: repeating-linear-gradient(45deg, var(--bg), var(--bg) 6px, var(--paper) 6px, var(--paper) 12px); color: var(--muted); }
.dex-card.got { border-color: var(--sun); box-shadow: 0 4px 0 var(--sun-deep); }
.dex-prog { width: 100%; max-width: 560px; }
.dex-modal { position: fixed; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(31, 58, 44, .5); padding: 16px; animation: fadeIn .2s; }
.flip { width: min(86vw, 340px); perspective: 900px; }
.flip-in { position: relative; transition: transform .6s; transform-style: preserve-3d; animation: flipIn .7s .1s both; }
.flip-in > div { backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--paper); border-radius: 26px; border: 4px solid var(--sun); padding: 18px; text-align: center; }
.dex-back { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.dex-back .big { font-family: var(--kai); font-size: 4.4rem; line-height: 1; }
.dex-back .zy { font-size: max(var(--fs-min), 1.4rem * var(--fs-m)); color: var(--sky-deep); }
.dex-back .kind { font-size: max(var(--fs-min), .95rem * var(--fs-s)); padding: 2px 12px; border-radius: 99px; background: var(--sun-soft); color: var(--sun-deep); }
.dex-back .evo { display: flex; align-items: center; gap: 10px; }
.dex-back .evo .pic { width: 84px; height: 84px; background: #FBF3E3; border-radius: 16px; border: 2px dashed #D9C39A; }
.dex-back .evo .arrow { font-size: max(var(--fs-min), 1.6rem * var(--fs-l)); color: var(--muted); }
.dex-back .evo .big { font-size: 3.6rem; }
.dex-back .parts { display: flex; gap: 6px; align-items: center; font-size: max(var(--fs-min), 1.6rem * var(--fs-l)); font-family: var(--kai); }
.dex-back .parts span { padding: 2px 10px; border-radius: 12px; background: var(--sky-soft); }
.dex-back p { margin: 0; font-size: max(var(--fs-min), 1.1rem * var(--fs-m)); line-height: 1.6; }
@keyframes flipIn { from { transform: rotateY(180deg); } to { transform: rotateY(0); } }
@keyframes drift { 0%, 100% { transform: translate(0, 0) rotate(0) } 50% { transform: translate(14px, -10px) rotate(14deg) } }

/* 連擊、寶箱題 */
.combo { flex: none; display: none; align-items: center; gap: 2px; padding: 2px 10px; border-radius: 99px; background: #FFE7D0; color: #C2410C; font-size: max(var(--fs-min), .95rem * var(--fs-s)); white-space: nowrap; }
.combo.on { display: inline-flex; animation: pop .45s; }
.combo svg { width: 18px; height: 18px; }
.game.fire .opts, .game.fire .tiles { filter: drop-shadow(0 0 10px rgba(246, 120, 40, .45)); }
.game.golden .tzg, .game.golden .listen-btn, .game.golden .tiles { box-shadow: 0 0 0 5px #FFE07A, 0 0 26px #F6B12F; }
.chest-tag { display: inline-flex; align-items: center; gap: 4px; padding: 1px 10px; border-radius: 99px; background: linear-gradient(180deg, #FFE07A, #F6B12F); color: #6B4A06; font-size: max(var(--fs-min), .9rem * var(--fs-s)); animation: pulse 1.2s ease-in-out infinite; }
.chest-tag svg { width: 18px; height: 18px; }
.shop-sec.limited h3::after { content: "（答對寶箱題才拿得到）"; font-size: max(var(--fs-min), .9rem * var(--fs-s)); color: var(--muted); }
.item .lock { color: var(--muted); font-size: max(var(--fs-min), .9rem * var(--fs-s)); min-height: 44px; display: grid; place-items: center; }

/* 學習報告 */
.report { align-items: stretch; max-width: 600px; margin: 0 auto; }
.report .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }   /* 只套在學習報告，不能影響答題的字格 */
.tile-stat { padding: 10px 14px; background: var(--paper); border: 3px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; }
.tile-stat small { color: var(--muted); font-size: max(var(--fs-min), .9rem * var(--fs-s)); }
.tile-stat b { font-size: max(var(--fs-min), 1.9rem * var(--fs-l)); font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile-stat span { color: var(--muted); font-size: max(var(--fs-min), .85rem * var(--fs-s)); }
.rep-sec { padding: 12px 14px; background: var(--paper); border: 3px solid var(--line); border-radius: 18px; }
.rep-sec h3 { margin: 0 0 6px; font-size: max(var(--fs-min), 1.1rem * var(--fs-m)); font-weight: 400; }
.rep-sec summary { cursor: pointer; font-size: max(var(--fs-min), 1.05rem * var(--fs-m)); }
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .tip { position: absolute; top: 0; width: 150px; padding: 4px 8px; border-radius: 10px; background: var(--ink); color: #fff; font-size: max(var(--fs-min), .85rem * var(--fs-s)); text-align: center; pointer-events: none; }
.rep-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 8px; }
.rep-table th, .rep-table td { padding: 4px 6px; border-bottom: 1px solid var(--line); text-align: right; }
.rep-table th:first-child, .rep-table td:first-child { text-align: left; }
.hard-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.hard-list li { display: flex; align-items: baseline; gap: 8px; padding: 4px 8px; border-radius: 12px; background: var(--bg); }
.hard-list b { font-family: var(--kai); font-weight: 400; font-size: max(var(--fs-min), 1.6rem * var(--fs-l)); }
.hard-list span { font-size: max(var(--fs-min), .85rem * var(--fs-s)); color: var(--muted); }

/* 新題型 */
.build-parts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.build-parts .tile { width: min(22vw, 15vh, 104px); font-size: min(16vw, 11vh, 72px); }
.build-parts .plus { font-size: max(var(--fs-min), 2rem * var(--fs-l)); font-weight: 400; color: var(--muted); }
.listen-btn.small { width: min(110px, 14vh); height: min(110px, 14vh); }
.en-def ~ .listen-btn.small, .en-sent ~ .listen-btn.small { width: min(78px, 10vh); height: min(78px, 10vh); }   /* 英英、句子題的喇叭小一點，題目和選項比較重要 */
.en-def ~ .listen-btn.small span, .en-sent ~ .listen-btn.small span { font-size: max(var(--fs-min), min(.8rem, 1.7vh) * var(--fs-s)); }
.holes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 420px; }
.hole { position: relative; height: min(110px, 15vh); border: none; background: none; padding: 0; overflow: hidden; }
.hole .dirt { position: absolute; left: 6%; right: 6%; bottom: 0; height: 34%; border-radius: 50%; background: radial-gradient(ellipse at 50% 30%, #5E4630, #3B2A1C); }
.hole .mole { position: absolute; left: 18%; right: 18%; bottom: 12%; height: 80%; border-radius: 48% 48% 20% 20%; background: radial-gradient(circle at 40% 30%, #C79A6A, #8B5E3C); display: grid; place-items: center; transform: translateY(110%); transition: transform .18s; }
.hole .mole b { font-family: var(--kai); font-weight: 400; font-size: min(10vw, 6vh, 2.8rem); color: #fff; text-shadow: 0 2px 0 #5E3A1E; }
.hole.up .mole { transform: translateY(0); }
.hole.shake .mole { animation: shake .4s; }
.seq-area { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
.stroke-box svg { width: min(64vw, 42vh, 320px); height: auto; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }   /* 用手指描筆畫：畫的時候頁面不要跟著捲動、縮放 */
.stroke-box .trace-line { fill: none; stroke: #2F7DBF; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; opacity: .75; pointer-events: none; }   /* 手指畫過的軌跡 */
.stroke-box .trace-line.out { opacity: 0; transition: opacity .3s; }
.stroke-box .glow { animation: pulse .9s ease-in-out infinite; transform-origin: center; }
.slots { display: flex; gap: 6px; }
.slot { min-width: 46px; height: 52px; border-radius: 12px; border: 3px dashed var(--line); background: var(--paper); display: grid; place-items: center; font-size: max(var(--fs-min), 1.8rem * var(--fs-l)); }
.slot.on { border-style: solid; border-color: var(--leaf); background: var(--leaf-soft); }
.slot.now { border-color: var(--sky); }
.zy-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(62px, 1fr)); gap: 8px; width: 100%; max-width: 440px; }
.zy-tiles .opt { min-height: clamp(48px, 8vh, 72px); }
.zy-tiles .opt.tone { font-size: max(var(--fs-min), min(1.8rem, 4vh) * var(--fs-l)); }

/* 雙人對戰 */
.duel-setup { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; width: 100%; }
.duel-col { padding: 10px; border-radius: 20px; border: 3px solid var(--line); background: var(--paper); }
.duel-col.blue { border-color: var(--sky); }
.duel-col.red { border-color: var(--coral); }
.duel-col h3 { margin: 0 0 8px; font-size: max(var(--fs-min), 1.15rem * var(--fs-m)); font-weight: 400; text-align: center; }
.duel-people { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }

/* 上下兩半一樣大：兩列都是 minmax(0, 1fr)、寬度都填滿（上半部轉 180 度給對面的人看） */
.duel { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); gap: 6px; }

.duel .opts { max-width: 440px; gap: 8px; }
.duel .opt { min-height: min(68px, 8.5vh); }
.duel .opt.char { font-size: min(3rem, 5.5vh); }
.duel .opt.zy { font-size: max(var(--fs-min), min(1.8rem, 3.4vh) * var(--fs-l)); }
.duel-mid { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0 6px; font-size: max(var(--fs-min), 1.05rem * var(--fs-m)); }
.duel-mid .icon-btn { width: 52px; height: 52px; }
/* 英文、數學題 */
.subj-tabs .btn-small { min-width: 92px; font-size: max(var(--fs-min), 1.1rem * var(--fs-m)); }
.math-q { font-size: min(3.6rem, 10vw, 8.5vh); font-variant-numeric: tabular-nums; background: rgba(255, 253, 247, .92); border: 3px solid var(--line); border-radius: 22px; padding: 4px 24px; line-height: 1.25; white-space: nowrap; }
.count-pic { display: grid; gap: 2px; font-size: max(var(--fs-min), min(2.3rem, 7vw, 5.4vh) * var(--fs-l)); line-height: 1.2; background: rgba(255, 253, 247, .92); border: 3px solid var(--line); border-radius: 22px; padding: 6px 16px; text-align: left; letter-spacing: .08em; }
.en-word { font-family: var(--en); font-size: min(4.2rem, 13vw, 9.5vh); line-height: 1.15; background: rgba(255, 253, 247, .92); border: 3px solid var(--line); border-radius: 22px; padding: 2px 26px; }
.en-pic { font-size: min(5.6rem, 18vw, 13vh); line-height: 1.1; }
.en-font { font-family: var(--en); font-size: 1.4em; }
.opt.num { font-size: min(2.6rem, 8vw, 5.6vh); font-variant-numeric: tabular-nums; }
.opt.pic { font-size: min(3.4rem, 10vw, 7vh); line-height: 1; }
.opt.en { font-family: var(--en); font-size: max(var(--fs-min), min(2.2rem, 7vw, 4.8vh) * var(--fs-l)); }
.opt.en.long { font-size: max(var(--fs-min), min(1.85rem, 5.4vw, 4vh) * var(--fs-l)); }   /* 長單字縮小，才不會超出按鈕（同一題四個選項一起縮） */
.opt.en.xlong { font-size: max(var(--fs-min), min(1.55rem, 4.3vw, 3.6vh) * var(--fs-l)); }   /* straightforward、administrative 這類特長的字 */

@media (max-width: 560px) { .en-sent { padding: 6px 14px; } }
.en-sent u { text-decoration-thickness: 3px; text-underline-offset: 6px; display: inline-block; line-height: 1.1; }   /* 空格整塊換行，不會掛在行尾超出框 */
/* 分數：上下兩行（分子、分數線、分母）；帶分數的整數寫在左邊 */
.frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; font-size: .62em; line-height: 1.08; margin: 0 .1em; }
.frac > span:first-child { border-bottom: .09em solid currentColor; padding: 0 .18em; }
.mixed { display: inline-flex; align-items: center; gap: .04em; }
.math-q:has(.frac) { padding-block: 2px; }
.opt .frac { font-size: .82em; }
/* 遠端對戰（各用各的平板） */
.r-setup .btn-big:disabled, .r-lobby .btn-big:disabled, [data-act="r-start"]:disabled, [data-act="r-again"]:disabled { opacity: .4; box-shadow: none; cursor: default; }
.r-pad button:disabled { opacity: .4; }
.duel.rduel { grid-template-rows: auto auto 1fr; max-width: 600px; margin: 0 auto; width: 100%; }
.r-foe { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-radius: 18px; border: 3px solid var(--coral); background: rgba(248, 224, 222, .7); font-size: max(var(--fs-min), 1.05rem * var(--fs-m)); }
.r-foe .pet { width: min(44px, 6.5vh); }
.r-foe em { font-style: normal; color: var(--sun-deep); margin-left: auto; }
.r-foe.won { box-shadow: 0 0 0 4px var(--sun); }
.rduel .opts { max-width: 560px; gap: 14px; }
.rduel .opt { min-height: min(140px, 15vh); }
.rduel .opt.char { font-size: min(4.8rem, 9vh); }
.rduel .opt.zy { font-size: min(2.8rem, 5.2vh); }
.rduel .duel-q { font-size: min(15vh, 5.6rem); }
.opt.pending { border-color: var(--sky-deep); background: var(--sky-soft); }
.r-code { font-size: min(4.2rem, 10vh); letter-spacing: .25em; padding-left: .25em; font-variant-numeric: tabular-nums; line-height: 1; }
.r-vs { display: flex; align-items: center; gap: 18px; font-size: max(var(--fs-min), 1.4rem * var(--fs-m)); }
.r-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 96px; }
.r-slot .pet { width: min(84px, 12vh); }
.r-slot.empty .pet { opacity: .3; filter: grayscale(1); }
.r-boxes { display: flex; gap: 10px; }
.r-boxes span { width: 58px; height: min(66px, 9vh); border: 3px solid var(--line); border-radius: 14px; display: grid; place-items: center; font-size: max(var(--fs-min), 2rem * var(--fs-l)); background: var(--paper); }
.r-pad { display: grid; grid-template-columns: repeat(3, 78px); gap: 10px; }
.r-pad button { height: min(64px, 8.5vh); font-size: max(var(--fs-min), 1.6rem * var(--fs-l)); border-radius: 18px; border: 3px solid var(--line); background: var(--paper); box-shadow: 0 4px 0 var(--line); }
.r-pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
/* 數字鍵盤作答（加減乘除、四則、九九、直式） */
.numpad { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: min(10px, 1.2vh); width: min(100%, 340px); }
.nk { height: clamp(44px, 7vh, 68px); padding: 0; font-size: max(var(--fs-min), min(2rem, 4.2vh) * var(--fs-l)); color: var(--ink); font-variant-numeric: tabular-nums;
  border: 3px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: 0 5px 0 var(--line); }
.nk:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
.nk.fn { font-size: max(var(--fs-min), min(1.2rem, 2.8vh) * var(--fs-m)); background: #FFF1E6; }
.nk.ok { font-size: max(var(--fs-min), min(1.3rem, 3vh) * var(--fs-m)); background: var(--leaf-soft); border-color: var(--leaf); box-shadow: 0 5px 0 var(--leaf); }
.pad-ans { display: inline-block; min-width: 1.4em; padding: 0 .15em; margin-left: .1em; border-bottom: .09em solid var(--sky); color: var(--sky-deep); text-align: center; line-height: 1.1; }
.pad-ans.on { color: var(--ink); border-bottom-color: var(--sun-deep); }
.pad-game .math-q { margin-top: 2px; }
/* 直式計算：左邊格子、右邊（手機在下面）這一步的小算式和鍵盤 */
.vx { display: flex; flex-direction: column; align-items: center; gap: min(8px, 1vh); width: 100%; max-width: 820px; }
.vleft, .vright { display: flex; flex-direction: column; align-items: center; gap: min(8px, 1vh); }
@media (min-aspect-ratio: 1/1) { .vx { flex-direction: row; justify-content: center; align-items: center; gap: 16px; } .vleft { flex: none; max-width: 58%; } .vright { flex: 1 1 0; min-width: 0; max-width: 340px; } .vright .numpad { width: 100%; } }
.vbar { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; max-width: 420px; }
.vbar li { padding: 0 9px; border-radius: 999px; border: 2px solid var(--line); background: var(--paper); font-size: max(var(--fs-min), min(.9rem, 2.1vh) * var(--fs-s)); line-height: 1.6; white-space: nowrap; }
.vbar li.now { background: var(--sun); border-color: var(--sun-deep); }
.vbar li.ok { background: var(--leaf-soft); border-color: var(--leaf); }
.vgrid { --cs: min(52px, 11vw, 5.6vh); display: grid; grid-template-columns: repeat(var(--w), var(--cs)); background: rgba(255, 253, 247, .95); border: 3px solid var(--line); border-radius: 18px; padding: 2px 10px 6px; font-variant-numeric: tabular-nums; }
.vc { height: var(--cs); display: grid; place-items: center; position: relative; font-size: calc(var(--cs) * .68); line-height: 1; }
.vc.vh { height: calc(var(--cs) * .56); font-size: max(var(--fs-min), calc(var(--cs) * .3)); color: var(--sky-deep); white-space: nowrap; }
.vc.vcar { height: calc(var(--cs) * .48); }
.vc .cy { font-style: normal; font-size: calc(var(--cs) * .38); color: #E07A1F; }
.vc.hot { background: rgba(246, 177, 47, .24); }
.vc.vh.hot { border-radius: 10px 10px 0 0; }
.vc.use { color: var(--sky-deep); }
.vc.wr { color: #2E6B47; }
.vc.lz { opacity: .25; }
.vc.vop { color: var(--sky-deep); }
.vc.vop small { font-size: .6em; }
.vc .vq { font-style: normal; width: 82%; height: 82%; display: grid; place-items: center; color: var(--sun-deep); border: 2px dashed var(--sun-deep); border-radius: 8px; background: #FFF8E1; }
.vc s { text-decoration-color: #D9665F; text-decoration-thickness: 2px; opacity: .55; }
.vc .nv { position: absolute; top: -12%; right: 0; font-style: normal; font-size: calc(var(--cs) * .36); color: #D9665F; }
.vc .b10 { font-style: normal; font-size: calc(var(--cs) * .36); color: #D9665F; align-self: start; margin-top: 8%; }
.vc:has(.b10) { grid-auto-flow: column; justify-content: center; place-items: initial; align-items: center; }
.vxline { grid-column: 1 / -1; border-top: 3px solid var(--ink); margin: 1px 0 2px; }
.vtitle { margin: 0; font-size: max(var(--fs-min), min(1.25rem, 2.9vh) * var(--fs-m)); }
.veq { font-size: min(2.6rem, 9vw, 5.6vh); padding: 2px 18px; }
.vhint { margin: 0; max-width: 360px; color: #9A4320; background: #FFF4E5; border: 2px solid #F3C38B; border-radius: 12px; padding: 2px 10px; font-size: max(var(--fs-min), min(1.05rem, 2.5vh) * var(--fs-s)); }
.vchk { max-width: 340px; background: rgba(255, 253, 247, .95); border: 3px solid var(--leaf); border-radius: 16px; padding: 6px 14px; font-size: max(var(--fs-min), min(1.2rem, 2.8vh) * var(--fs-m)); line-height: 1.5; }
.vgo { min-height: 52px; }
.stack.vert-game { gap: min(8px, 1vh); }
/* 直式在直的螢幕：鍵盤排成兩排六欄，格子才有地方 */
@media (max-aspect-ratio: 1/1) { .vert-game .numpad { grid-template-columns: repeat(6, minmax(0, 1fr)); width: min(100%, 460px); gap: 6px; } .vert-game .nk { height: clamp(44px, 6vh, 64px); border-radius: 14px; } .vert-game .nk.fn, .vert-game .nk.ok { font-size: max(var(--fs-min), min(1.05rem, 2.4vh) * var(--fs-m)); } }
/* 九九跳石頭：河上九顆石頭，夥伴答對一題跳一顆 */
.hop-river { position: relative; flex: none; width: min(100%, 700px); height: min(23vh, 31vw, 200px); border-radius: 26px; overflow: visible;
  background: linear-gradient(180deg, rgba(150, 214, 240, .92), rgba(74, 152, 212, .92)); border: 3px solid rgba(255, 255, 255, .85); box-shadow: inset 0 -10px 0 rgba(40, 110, 170, .25); }
.hop-bank { position: absolute; left: 0; top: 0; bottom: 0; width: 5%; border-radius: 24px 0 0 24px; background: linear-gradient(90deg, #7CC46A, #5FAF55); }
.hop-flag { position: absolute; right: 8px; top: 6px; padding: 0 10px; border-radius: 999px; background: rgba(255, 253, 247, .9); font-size: max(var(--fs-min), min(1rem, 2.2vh) * var(--fs-s)); }
.stone { position: absolute; width: 9.6%; aspect-ratio: 1.2; transform: translate(-50%, -50%); padding: 0; border-radius: 50%; border: 3px solid #8C8F95;
  background: radial-gradient(circle at 35% 30%, #F1F2F4, #A9ADB4); box-shadow: 0 5px 0 #6B6F76; color: #4A4F57; font-size: max(.72rem, min(1.15rem, 2.4vw, 2.6vh)); line-height: 1; font-variant-numeric: tabular-nums; }
.stone.lit { background: radial-gradient(circle at 35% 30%, #FFF6C9, #F6B12F); border-color: #D98E0C; box-shadow: 0 5px 0 #B9842A, 0 0 0 5px rgba(255, 230, 120, .55); color: #5A3A00; cursor: pointer; }
.stone.ok { background: radial-gradient(circle at 35% 30%, #E4F7E8, #6CC28A); border-color: #3C9A66; box-shadow: 0 5px 0 #2E7A50; color: #1F4D33; font-size: max(.8rem, min(1.35rem, 2.8vw, 3vh)); }
.stone:not(.lit):not(.ok) { opacity: .75; pointer-events: none; }
/* 隱藏關卡的「？」石頭：沒打開是灰色，打開了發亮，打贏過變綠色 */
.secret-stone { display: grid; place-items: center; width: 100%; aspect-ratio: 1.15; border-radius: 50%; border: 3px solid #8C8F95; background: radial-gradient(circle at 35% 30%, #F1F2F4, #9EA3AB); box-shadow: 0 5px 0 #6B6F76; color: #5A5F68; font-weight: 900; line-height: 1; }
.open > .secret-stone { position: relative; background: radial-gradient(circle at 35% 30%, #FFF6C9, #F6B12F); border-color: #D98E0C; box-shadow: 0 5px 0 #B9842A, 0 0 0 6px rgba(255, 230, 120, .55); color: #6A3F00; }
.won > .secret-stone { background: radial-gradient(circle at 35% 30%, #E4F7E8, #6CC28A); border-color: #3C9A66; box-shadow: 0 5px 0 #2E7A50; color: #1F4D33; }
.won > .secret-stone::after { display: none; }
.rnode.rsecret { transform: translate(-50%, -50%); }
.portrait .rnode.rsecret { width: 12cqw; } .portrait .rsecret .secret-stone { font-size: 6cqw; }
.landscape .rnode.rsecret { width: 7.4cqw; } .landscape .rsecret .secret-stone { font-size: 3.6cqw; }
.rsecret .rn-tag { top: 104%; }
.landscape .rsecret .rn-tag { top: 50%; left: auto; right: 112%; transform: translateY(-50%); }   /* 橫放：石頭靠右邊，名字放在石頭左邊 */
.node.secret { width: 64px; height: 64px; border: 0; background: none; box-shadow: none; padding: 0; animation: none; }
.node.secret .secret-stone { font-size: 1.8rem; }
.node.secret small { top: auto; bottom: 74px; }
/* 發亮的石頭外面一圈光一明一暗：只動外圈的透明度（手機上不用每一格重畫整顆石頭，原本動 box-shadow 會讓換題卡卡的） */
.stone.lit::after, .open > .secret-stone::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; box-shadow: 0 0 0 10px rgba(255, 230, 120, .3); opacity: 0; pointer-events: none; animation: stoneGlow .9s ease-in-out infinite alternate; }
@keyframes stoneGlow { to { opacity: 1; } }
.hop-river.narrow { height: min(30vh, 56vw, 250px); }
.hop-river.narrow .hop-flag { top: auto; bottom: 6px; }
.hop-river.narrow .stone { width: 15.5%; font-size: max(.85rem, min(1.25rem, 4.4vw)); }
.hop-river.narrow .hop-me { width: 12%; }
@media (max-aspect-ratio: 1/1) and (max-height: 720px) { .hop-river.narrow { height: min(23vh, 56vw); } .hop-game .nk { height: clamp(40px, 6vh, 68px); } .hop-game .hop-boss { width: min(150px, 14vh); } .hop-river.narrow .hop-flag { display: none; } }   /* 小手機直放：河、按鍵、頭目都矮一點，一個畫面放得下；「幾的九九」牌子會蓋到石頭，先收起來（題目就看得出來） */
.hop-me { position: absolute; z-index: 2; width: min(9%, 64px); transform: translate(-50%, -112%); transition: left .6s ease-in-out, top .6s ease-in-out; pointer-events: none; }
.hop-me .pet { width: 100%; }
.hop-me.jump > * { animation: hopUp .6s ease-out; }
@keyframes hopUp { 45% { transform: translateY(-55%); } }
.hop-boss { width: min(150px, 17vh); flex: none; }
.hop-boss .bz, .hop-boss img.boss { width: 100%; height: auto; display: block; }
.stack.hop-game { gap: min(12px, 1.4vh); }
@media (min-aspect-ratio: 1/1) and (min-height: 451px) and (max-height: 820px) { .hop-game .numpad { grid-template-columns: repeat(6, minmax(0, 1fr)); width: min(100%, 560px); } }   /* 電腦、平板橫放比較矮：鍵盤排兩列，河和題目才放得下 */
@media (max-height: 450px) and (orientation: landscape) {
  .numpad { grid-template-columns: repeat(6, minmax(0, 1fr)); width: min(100%, 500px); gap: 6px; }
  .nk { height: 40px; border-radius: 14px; }
  .vgrid { --cs: min(40px, 8.4vh); }
  .vbar li { line-height: 1.35; }
  .hop-river { height: min(26vh, 106px); }
  .stone { width: 7.6%; }
  .hop-me { width: 7%; }
  .hop-boss { width: 56px; }   /* 手機橫放：頭目小一點，鍵盤第二排才不會被切掉 */
  .vert-game:not(.answered) .coach { display: none; }   /* 小幫手固定在左下角會蓋到直式格子；答錯的提示在格子旁邊 */
}
.r-setup .duel-col { width: 100%; max-width: 520px; }

/* 頭目關、難度、休息 */
.boss { width: 100%; height: auto; }
.party-card .boss.big { width: 170px; animation: bob 1.6s ease-in-out infinite; }
.boss-hud { display: flex; align-items: center; gap: 6px; width: 100%; }
.boss-mini { width: 44px; flex: none; }
.boss-mini.hit { animation: shake .45s; }
.hp { flex: 1; height: 14px; border-radius: 99px; background: #E3E6F2; overflow: hidden; border: 2px solid #A9B4D6; min-width: 50px; }
.hp i { display: block; height: 100%; background: linear-gradient(90deg, #8B6CC4, #4C8FD6); transition: width .4s; }
.hearts { display: flex; gap: 2px; flex: none; }
.heart { width: 20px; height: 18px; }
.node.trophy.boss-open { border-style: solid; border-color: #8B6CC4; background: #EEE8FA; animation: bob 1.4s ease-in-out infinite; }
.node.trophy.boss-open svg, .node.trophy.won svg { width: 64px; height: auto; }
.diff-chip { font-size: max(var(--fs-min), .85rem * var(--fs-s)); padding: 1px 10px; border-radius: 99px; background: var(--leaf-soft); border: 2px solid var(--leaf); }
.diff-chip.hard { background: #FDE7E4; border-color: var(--coral); }
.rest-count { font-size: 3rem !important; font-variant-numeric: tabular-nums; color: var(--sky-deep); }
.rest .btn-big:disabled { opacity: .45; }

/* 英雄榜分頁 */
.hero-tabs { display: flex; gap: 8px; }
.hero-tabs button[aria-pressed="true"] { background: var(--sun); border-color: var(--sun-deep); }

/* 金幣與商店 */
.coin { display: inline-grid; place-items: center; width: 1.25em; height: 1.25em; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #FFF1A8, #F6B12F 55%, #C98510); color: #8A5A08; font-size: .8em; font-weight: 700; vertical-align: -0.2em; box-shadow: inset 0 0 0 1.5px #E7A21E; }
.me-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 100%; }
.shop-top { display: flex; align-items: center; gap: 16px; width: 100%; max-width: 560px; padding: 10px 16px; background: var(--paper); border: 3px solid var(--line); border-radius: 24px; }
.shop-top .pet { width: min(30vw, 130px); flex: none; }
.shop-top .coins { font-size: max(var(--fs-min), 1.6rem * var(--fs-l)); }
.shop-top p { margin: 4px 0 0; color: var(--muted); font-size: max(var(--fs-min), .95rem * var(--fs-s)); }
.shop-sec { width: 100%; max-width: 560px; }
.tg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }   /* 最多 4 樣，兩欄剛好 */
.tg-sw { min-width: 0; display: flex; align-items: center; gap: 6px; min-height: 48px; padding: 4px 10px; border-radius: 16px; border: 2px solid var(--line); background: var(--paper); color: var(--ink); font: inherit; text-align: left; }
.tg-sw .tg-ic { font-size: 1.4em; line-height: 1; }
.tg-sw .tg-t { flex: 1; min-width: 0; line-height: 1.15; white-space: nowrap; }
.tg-sw small { display: block; font-size: .75em; color: var(--muted); }
.tg-sw .sw { flex: none; position: relative; width: 42px; height: 26px; border-radius: 99px; background: #BFC9C2; transition: background .15s; }
.tg-sw .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: left .15s; }
.tg-sw[aria-checked="true"] { border-color: var(--leaf); background: var(--leaf-soft); }
.tg-sw[aria-checked="true"] .sw { background: var(--leaf); }
.tg-sw[aria-checked="true"] .sw::after { left: 19px; }
.shop-sec h3 { margin: 6px 0; font-size: max(var(--fs-min), 1.2rem * var(--fs-m)); font-weight: 400; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.item {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px;
  border: 3px solid var(--line); border-radius: 20px; background: var(--paper); text-align: center;
}
.item.trying { border-color: var(--sky); background: var(--sky-soft); }
.item.on { border-color: var(--leaf); }
.item .pet { width: 96px; }
/* 商品放大視窗：大大的夥伴穿上這件，3D 模式旁邊放商品本身的圖 */
.shop-zoom { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 16px; background: rgba(16, 30, 60, .55); animation: fadeIn .2s ease-out; }
.sz-card { position: relative; width: min(100%, 560px); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 18px 20px; border-radius: 28px;
  background: linear-gradient(180deg, #FFFEF8 0%, #FFF1CC 100%); border: 4px solid #E2B24A; box-shadow: 0 8px 0 #C9963A, 0 20px 40px rgba(0, 0, 0, .35); color: #3B2A12; animation: pop .3s; }
.sz-x { position: absolute; top: 10px; right: 10px; width: 48px; height: 48px; background: #FFFBF0; border-color: #E2B24A; box-shadow: 0 3px 0 #C9963A; color: #5A3A0E; z-index: 1; } .sz-x svg { width: 22px; height: 22px; }
.sz-show { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; background: radial-gradient(circle at 42% 55%, rgba(255, 210, 110, .55), transparent 62%); }
.sz-show .pet { width: min(62vw, 42vh, 300px); flex: none; }
.sz-art { width: min(28vw, 22vh, 150px); aspect-ratio: 1; object-fit: contain; padding: 10px; border-radius: 22px; background: #fff; border: 3px solid #F0D99A; box-shadow: 0 4px 0 #E3C98C; }
.sz-card h3 { margin: 0; font-size: max(var(--fs-min), 1.6rem * var(--fs-l)); font-weight: 400; text-align: center; }
.sz-act { width: min(100%, 280px); display: grid; } .sz-act .btn-small { min-height: 56px; font-size: max(var(--fs-min), 1.15rem * var(--fs-m)); }
.sz-act .buy { background: var(--sun); border-color: var(--sun-deep); color: #1F3A2C; } .sz-act .buy.confirm { background: var(--coral); border-color: #A8443E; color: #fff; }
.sz-act .wear { background: var(--leaf); border-color: #2A7049; color: #fff; }
.sz-act .lack, .sz-act .lock { color: #7A6340; font-size: max(var(--fs-min), 1rem * var(--fs-s)); min-height: 48px; display: grid; place-items: center; text-align: center; }
@media (max-width: 560px) { .sz-show { flex-direction: column; } .sz-show .pet { width: min(64vw, 36vh); } .sz-art { width: min(30vw, 16vh); } .sz-card h3 { font-size: max(var(--fs-min), 1.35rem * var(--fs-m)); } }
.item .iname { font-size: max(var(--fs-min), 1.05rem * var(--fs-m)); }
.item .btn-small { min-height: 44px; width: 100%; }
.item .buy { background: var(--sun); border-color: var(--sun-deep); }
.item .buy.confirm { background: var(--coral); border-color: #A8443E; color: #fff; }
.item .wear { background: var(--leaf); border-color: #2A7049; color: #fff; }
.item .lack { color: var(--muted); font-size: max(var(--fs-min), .9rem * var(--fs-s)); min-height: 44px; display: grid; place-items: center; }

/* 答題資訊列：倒數計時、進度、這回合得分 */
.hud { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; max-width: 480px; }
.hud-mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.hud .dots { width: 100%; gap: 5px; }
.place { font-size: max(var(--fs-min), .9rem * var(--fs-s)); padding: 1px 12px; border-radius: 99px; background: rgba(255, 253, 247, .9); border: 2px solid var(--line); }

/* 答題背景：該關的地圖風景（天空鋪滿、景物貼在畫面底部） */
#scene { position: fixed; inset: 0; z-index: 0; display: none; background: var(--sky, var(--bg)); pointer-events: none; }
#scene.on { display: block; }
#scene svg { position: absolute; left: 0; bottom: 0; width: 100%; height: min(46vw, 52vh); overflow: hidden; }
#scene::after { content: ""; position: absolute; inset: 0; background: rgba(255, 253, 247, .18); }
#app { position: relative; z-index: 1; }
.game .example { background: rgba(255, 253, 247, .85); padding: 0 12px; border-radius: 12px; }
.hud .dots i { width: 12px; height: 12px; }
/* 3D 背景很花：進度點自己有一條底，不會跟風景（風車、房子）混在一起，也跟下面的地點標籤分開 */
body.v3d .hud .dots { width: auto; max-width: 100%; padding: 3px 8px; border-radius: 99px; background: rgba(255, 253, 247, .82); box-shadow: 0 1px 0 rgba(120, 85, 30, .25); }
:root.night body.v3d .hud .dots { background: rgba(78, 98, 150, .85); }
body.v3d .hud-mid { gap: 5px; }
.timer {
  --p: 1; --c: var(--sky);
  position: relative; flex: none; width: 62px; height: 62px; border-radius: 50%;
  background: conic-gradient(var(--c) calc(var(--p) * 360deg), var(--line) 0);
  display: grid; place-items: center;
}
.timer::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: var(--paper); }
.timer b, .timer span { position: relative; }
.timer b { font-size: 1.45rem; font-weight: 400; line-height: 1; font-variant-numeric: tabular-nums; margin-top: 6px; }
.timer span { font-size: .7rem;   /* 計時圈大小固定，圈裡的字不跟著放大 */ color: var(--muted); margin-top: -14px; }
.timer.low { --c: var(--coral); animation: pulse .9s ease-in-out infinite; }
.timer.low b { color: #A8443E; }
.score {
  flex: none; min-width: 74px; padding: 6px 12px; border-radius: 16px; text-align: center;
  background: var(--sun-soft); border: 2px solid var(--sun); line-height: 1.2;
}
.score small { display: block; font-size: max(var(--fs-min), .75rem * var(--fs-s)); color: var(--sun-deep); }
.score b { font-size: max(var(--fs-min), 1.35rem * var(--fs-m)); font-weight: 400; font-variant-numeric: tabular-nums; }
.score.bump { animation: pop .45s; }
/* 手機橫放（畫面很矮）：工具列、答題資訊列、間距都縮小，小幫手移到左下角空白處，題目一個畫面放得下 */
@media (max-height: 450px) and (orientation: landscape) {
  .bar { min-height: 50px; padding-block: 4px 0; }
  .bar .icon-btn { width: 44px; height: 44px; }
  .bar .icon-btn svg { width: 24px; height: 24px; }
  body.v3d .bar h2 { padding: 1px 16px; border-width: 2px; box-shadow: 0 3px 0 #B9842A; }
  #screen.playing { padding-block: 2px 4px; }
  .stack.game { gap: 8px; }
  .hud .timer { width: 46px; height: 46px; }
  .hud .timer::before { inset: 5px; }
  .hud .timer b { font-size: 1.15rem; margin-top: 4px; }
  .hud .timer span { font-size: .6rem; margin-top: -10px; }
  .hud .score { min-width: 60px; padding: 2px 10px; }
  .hud .score small { font-size: max(var(--fs-min), .65rem * var(--fs-s)); }
  .hud .score b { font-size: max(var(--fs-min), 1.1rem * var(--fs-m)); }
  .hud-mid, body.v3d .hud-mid { flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 8px; }
  .hud .dots { width: auto; }
  .game .coach { position: fixed; left: 8px; bottom: 6px; z-index: 2; width: max(130px, calc((100vw - 520px) / 2)); max-width: 220px; min-height: 0; flex-direction: column; align-items: flex-start; gap: 2px; }
  .game .coach .pet { width: 40px; }
  .game .coach .bubble { font-size: max(var(--fs-min), .8rem * var(--fs-s)); padding: 4px 8px; }
  .game:has(.km-board) .coach { display: none; }   /* 成語配對的格子很寬，會蓋到小幫手；上面已經有「把成語和它的意思配成一對」 */
  .km-board { gap: 5px 10px; }
  .km-cell { min-height: 0; padding-block: 2px; }
  .result { gap: 3px; }
  .result:has(.celebrate) > .pet { display: none; }   /* 有寶箱／升級框時讓位給它們 */
  .celebrate { padding: 2px 10px; font-size: max(var(--fs-min), .95rem * var(--fs-s)); border-width: 2px; border-radius: 12px; max-width: 520px; }
  .result .celebrate .cele-ic { width: 22px; height: 22px; }
  .result .score-line .btn-small { min-height: 30px; padding-block: 0; }
  .result .btn-row .btn-big { min-height: 40px; padding-block: 2px; }
}
.float-pts { position: absolute; font-size: max(var(--fs-min), 1.8rem * var(--fs-l)); color: var(--sun-deep); text-shadow: 0 2px 0 #fff, 0 0 8px #fff; animation: rise 1.1s ease-out forwards; white-space: nowrap; }
.opt.reveal, .tile.reveal { background: var(--leaf-soft); border: 3px dashed var(--leaf); box-shadow: none; }
.score-line { color: var(--ink) !important; }
.score-line b { font-weight: 400; color: var(--sun-deep); font-size: max(var(--fs-min), 1.5rem * var(--fs-m)); font-variant-numeric: tabular-nums; }

/* 過關慶祝 */
.party {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center;
  background: rgba(31, 58, 44, .55); animation: fadeIn .25s ease-out;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.party.out { animation: fadeOut .3s ease-in forwards; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i { position: absolute; top: -24px; border-radius: 2px; animation: fall linear forwards; }
.party-wrap { position: relative; display: grid; place-items: center; }
.rays {
  position: absolute; width: 520px; height: 520px; max-width: 160vw; max-height: 160vw; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 225, 120, .55) 0 10deg, transparent 10deg 22deg);
  -webkit-mask: radial-gradient(circle, #000 35%, transparent 70%); mask: radial-gradient(circle, #000 35%, transparent 70%);
  animation: spin 9s linear infinite;
}
.party-card {
  position: relative; width: min(86vw, 360px); padding: 22px 18px 18px; text-align: center;
  background: var(--paper); border-radius: 30px; border: 4px solid var(--sun);
  box-shadow: 0 10px 0 var(--sun-deep); animation: popIn .55s cubic-bezier(.2, 1.6, .4, 1) both;
}
.party-card .pet { width: 130px; animation: hop .7s ease-in-out infinite; }
.party-card h2 { margin: 4px 0 0; font-family: var(--kai); font-size: clamp(2.6rem, 13vw, 3.4rem); font-weight: 400; color: var(--sun-deep); letter-spacing: .08em; line-height: 1.15; text-wrap: balance; }
.party-card p { margin: 6px 0 0; font-size: max(var(--fs-min), 1.15rem * var(--fs-m)); text-wrap: balance; }
.party-card p .nw, .score-line .nw { white-space: nowrap; }   /* 最後兩個字（「完成」）、「・去商店」不要被拆開掛在行尾 */
.party-card .party-stars { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
.party-card .party-stars svg { width: 46px; height: auto; }
.party-card .party-stars .s { fill: var(--sun); }
.party-card .party-stars .off .s { fill: var(--line); }
.party-card .tap { display: block; margin-top: 12px; color: var(--muted); font-size: max(var(--fs-min), .95rem * var(--fs-s)); }

@keyframes rise { from { transform: translate(-50%, 0); opacity: 1 } to { transform: translate(-50%, -70px); opacity: 0 } }
@keyframes fall { to { transform: translateY(115vh) rotate(var(--r)); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes popIn { 0% { transform: scale(.3); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
@keyframes fadeOut { to { opacity: 0 } }
@keyframes shake { 0%,100% { transform: translateX(0) } 20% { transform: translateX(-8px) } 40% { transform: translateX(8px) } 60% { transform: translateX(-5px) } 80% { transform: translateX(5px) } }
@keyframes pop { 0% { transform: scale(1) } 40% { transform: scale(1.1) } 100% { transform: scale(1) } }
@keyframes hop { 0%,100% { transform: translateY(0) } 35% { transform: translateY(-14px) } 60% { transform: translateY(0) } 75% { transform: translateY(-5px) } }
@keyframes tilt { 0%,100% { transform: rotate(0) } 30% { transform: rotate(-8deg) } 65% { transform: rotate(6deg) } }
@keyframes fly { from { transform: translate(0,0) scale(.6); opacity: 1 } to { transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(140deg); opacity: 0 } }
@keyframes starIn { 0% { transform: scale(0) rotate(-40deg) } 70% { transform: scale(1.2) } 100% { transform: scale(1) } }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.12) } }
@keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }

/* ---------- 黑夜模式：深藍夜空、星星一閃一閃、偶爾劃過流星（右上角的月亮／太陽按鈕切換） ---------- */
.icon-btn.theme { width: 50px; height: 50px; border-color: var(--sun); background: var(--sun-soft); color: var(--sun-deep); box-shadow: 0 4px 0 var(--sun-deep); }
.icon-btn.theme svg { width: 28px; height: 28px; }
.bar-right { display: flex; gap: 8px; align-items: center; flex: none; }
:root.night {
  --bg: #0D1736; --paper: #1B2849; --ink: #EEF2FB; --muted: #AFBBD4; --line: #33456F;
  --sun-soft: #4A3B14; --sky-soft: #1C3658; --leaf-soft: #17402C; --coral-soft: #4A2626;
  color-scheme: dark;
}
:root.night body { background: linear-gradient(180deg, #070D24 0%, #10204A 60%, #1B2C5C 100%) fixed; }
#sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
:root:not(.night) #sky .nt, #scene.on ~ #sky .dy { display: none; }   /* 答題時有自己的風景，白天裝飾先收起來 */
/* 黑夜沿用同一片山丘和雲，只是變暗；太陽、小鳥、蝴蝶去睡覺，換成月亮、星星和流星 */
:root.night #sky .sun, :root.night #sky .bird, :root.night #sky .fly { display: none; }
:root.night #sky .hills { filter: brightness(.4) saturate(.85) hue-rotate(28deg); }
:root.night #sky .cloud { opacity: .16; filter: none; }
/* 白天：藍天漸層、角落的太陽、慢慢飄的雲、飛過的小鳥和蝴蝶、底下一片小山丘 */
:root:not(.night) body {
  background-image: radial-gradient(rgba(202, 221, 207, .75) 1.2px, transparent 1.4px), linear-gradient(180deg, #CBE7F8 0%, #E1F1F1 42%, #EDF6E7 100%);
  background-size: 22px 22px, 100% 100%; background-attachment: scroll, fixed;
}
#sky .sun { position: absolute; left: -96px; top: -96px; width: 230px; height: 230px; border-radius: 50%; }
#sky .sun::before { content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 210, 90, .5) 0 9deg, transparent 9deg 22.5deg);
  -webkit-mask: radial-gradient(circle, transparent 30%, #000 34%, transparent 70%); mask: radial-gradient(circle, transparent 30%, #000 34%, transparent 70%);
  animation: spin 40s linear infinite; }
#sky .sun::after { content: ""; position: absolute; inset: 72px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #FFF3B8, #FFD256 60%, #F8BC35); box-shadow: 0 0 40px 14px rgba(255, 214, 90, .45); }
#sky .cloud { position: absolute; width: var(--w, 180px); animation: drift var(--t, 90s) linear infinite; animation-delay: var(--d, 0s); opacity: .95; filter: drop-shadow(0 6px 0 rgba(150, 190, 215, .25)); }
#sky .bird { position: absolute; width: 26px; animation: flyBy var(--t, 26s) linear infinite; animation-delay: var(--d, 0s); }
#sky .bird svg { display: block; width: 100%; animation: flap .5s ease-in-out infinite alternate; transform-origin: 50% 70%; }
#sky .fly { position: absolute; bottom: 14vh; width: 30px; animation: flutter 22s ease-in-out infinite; animation-delay: var(--d, 0s); }
#sky .fly svg { display: block; width: 100%; animation: flap .28s ease-in-out infinite alternate; }
#sky .hills { position: absolute; left: 0; right: 0; bottom: 0; height: min(24vh, 190px); }
#sky .hills svg { width: 100%; height: 100%; display: block; }
@keyframes drift { from { left: -280px } to { left: 105% } }
@keyframes flyBy { 0% { left: -40px; translate: 0 0 } 25% { translate: 0 -14px } 50% { translate: 0 6px } 75% { translate: 0 -10px } 60%, 100% { left: 108% } }
@keyframes flap { from { transform: scaleY(1) } to { transform: scaleY(.35) } }
@keyframes flutter { 0% { left: 8%; translate: 0 0 } 25% { translate: 0 -40px } 50% { left: 80%; translate: 0 -10px } 75% { translate: 0 -50px } 100% { left: 8%; translate: 0 0 } }
#sky .st { position: absolute; border-radius: 50%; background: #FFF8DC; box-shadow: 0 0 6px rgba(255, 248, 220, .9); animation: twinkle var(--t, 3s) ease-in-out infinite; animation-delay: var(--d, 0s); }
#sky .meteor { position: absolute; width: 150px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 85%, #FFF6C8); opacity: 0; transform: rotate(-35deg); animation: meteor var(--t, 9s) linear infinite; animation-delay: var(--d, 0s); }
#sky .meteor::after { content: ""; position: absolute; right: -2px; top: -2px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px 3px rgba(255, 246, 200, .9); }
#sky .moon { position: absolute; top: 70px; right: 6%; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFFBE6, #F3E3A6 70%); box-shadow: 0 0 40px 10px rgba(255, 240, 180, .35); }
#sky .moon::after { content: ""; position: absolute; left: 22px; top: 6px; width: 54px; height: 54px; border-radius: 50%; background: #0F1B40; }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7) } 50% { opacity: 1; transform: scale(1.15) } }
@keyframes meteor { 0% { opacity: 0; translate: 0 0 } 3% { opacity: 1 } 12% { opacity: 0; translate: -420px 300px } 100% { opacity: 0; translate: -420px 300px } }
/* 答題時的風景變成夜景 */
:root.night #scene { background: #0B1431; }
:root.night #scene svg > rect { fill: #0B1431; }   /* 風景裡的天空換成夜空，地面和建築變暗 */
:root.night #scene svg > g { filter: brightness(.5) saturate(.75) hue-rotate(-12deg); }

  if (z.startsWith('˙')) return { base: z.slice(1), tone: 0 };
  const t = { 'ˊ': 2, 'ˇ': 3, 'ˋ': 4 }[z.slice(-1)];
  return t ? { base: z.slice(0, -1), tone: t } : { base: z, tone: 1 };
}

  return '';
}

/* ---------- 聲音：語音朗讀 ---------- */
/* 裝置內建的語音品質差很多：優先挑「自然／線上／高品質」的（Edge 的 HsiaoChen Online (Natural)、Chrome 的 Google 國語、
   iPad 下載的美佳高品質），舊式的機器人聲音排後面；大人也可以在首頁「換聲音」自己選，存在 localStorage zizi-voice */
let zhVoice = null, enVoice = null, voiceChecked = false;
const VOICE_KEY = 'zizi-voice', SPEEDS = [0.85, 1, 1.15];

  const s = v.name + ' ' + v.voiceURI;
  if (/Natural|Neural|Online|Premium|高品質|Siri/i.test(s)) return 3;
  if (/Enhanced|加強|Google/i.test(s)) return 2;
  if (/eSpeak|compact|Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Fred|Junior|Kathy|Ralph/i.test(s)) return 0;
  return 1;
}
function voiceScore(v, sub) {
  const l = String(v.lang).replace('_', '-');
  if (NOVELTY.test(v.name)) return -999;
  let s = voiceKind(v) * 30;
  if (sub === 'zh') {
    if (/zh-HK|yue/i.test(l) || /Hong Kong|香港|粵|Cantonese/i.test(v.name)) return -999;   // 粵語不要
    if (/zh-TW|zh-Hant/i.test(l) || /Taiwan|臺灣|台灣/i.test(v.name)) s += 25;
    else if (/^(zh|cmn)/i.test(l)) s += 5;
    else return -999;
  } else if (/^en-US/i.test(l)) s += 10;
  else if (/^en/i.test(l)) s += 5;
  else return -999;
  if (/HsiaoChen|HsiaoYu|Meijia|美佳|Ava|Samantha|Jenny|Aria|Ana\b/i.test(v.name)) s += 4;
  return s;
}

  if (!('speechSynthesis' in window)) return;
  const choose = sub => { const L = voiceList(sub); return L.find(v => v.voiceURI === voicePref[sub]) || L[0] || null; };
  zhVoice = choose('zh'); enVoice = choose('en');
  if (speechSynthesis.getVoices().length) voiceChecked = true;
}
function voiceLabel(v) {   // 去掉「Microsoft」「- Chinese (Traditional, Taiwan)」這些長尾巴
  const n = v.name.replace(/^(Microsoft|Google|Apple)\s+/i, '').replace(/\s*[-–]\s*(Chinese|English|國語|中文|英語).*$/i, '').replace(/\s*\((Natural|Enhanced|Premium)\)/i, '').replace(/\s+Online\b/i, '').trim() || v.name;
  return `${n}${v.name.startsWith('Google') ? '（Google）' : ''}${/^(zh|cmn)[-_](CN|Hans)/i.test(v.lang) ? '・大陸腔' : ''}`;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.addEventListener?.('voiceschanged', () => { pickVoice(); if (S.screen === 'home' || S.screen === 'voice') render(); }); }

let speakTimer = 0, speakId = 0;
function speak(text) {
  if (!('speechSynthesis' in window) || !text) return;
  clearTimeout(speakTimer);
  const id = ++speakId;
  SND.speech(true, String(text).length * 0.3 + 2);   // 唸的時候配樂先壓低（被打斷的舊句子結束時不會把音樂叫回來）
  speechSynthesis.cancel();
  speakTimer = setTimeout(() => {
    /* «…» 裡面是英文，用英文的聲音唸；其他用中文 */
    const us = String(text).split(/«([^»]*)»/).map((s, i) => [s.trim(), i % 2 === 1]).filter(([s]) => s).map(([s, en]) => {
      const u = new SpeechSynthesisUtterance(s);
      const sp = SPEEDS[voicePref.speed ?? 1] || 1;
      /* 自然的語音用正常音高、速度只放慢一點；舊式語音維持慢一點、高一點比較清楚 */
      if (en) { u.lang = 'en-US'; if (enVoice) u.voice = enVoice; u.rate = (enVoice && voiceKind(enVoice) >= 2 ? 0.88 : 0.8) * sp; }
      else { u.lang = 'zh-TW'; if (zhVoice) u.voice = zhVoice; const good = zhVoice && voiceKind(zhVoice) >= 2; u.rate = (good ? 0.95 : 0.85) * sp; u.pitch = good ? 1 : 1.1; }
      return u;
    });
    if (!us.length) return SND.speech(false);
    const lb = $('.listen-btn');
    us[0].onstart = () => lb && lb.classList.add('playing');
    us[us.length - 1].onend = us[us.length - 1].onerror = () => { lb && lb.classList.remove('playing'); if (id === speakId) SND.speech(false); };
    us.forEach(u => speechSynthesis.speak(u));
  }, 80);
}

/* ---------- 九九跳石頭：一關一張九九表（n×1～n×9 九顆石頭），走完打石頭關的頭目 ---------- */

}

/* ---------- 直式計算：從個位開始一位一位算，答案寫進格子 ---------- */
/* 每個年級 5 關考哪幾種：a 加、s 減、m 乘，後面是位數（m32＝三位數×二位數）；一關裡從清單隨機挑 */

/* 照目前算到第幾步，算出格子裡要顯示什麼：R/P1/P2 寫好的數字、c 進位、x 借位後的新數字、b 借來的 1 */

/* ---------- 數字鍵盤作答：2 年級起的加減乘除、四則運算、九九跳石頭、直式計算 ----------
   1 年級（數字小、剛學）和數一數、比大小、分數、小數維持選擇題；雙人對戰也維持選擇題（搶答要快） */

function padHint(q) {

/* ---------- 九九跳石頭的關卡：前 9 題打亂跳石頭，後 9 題同一張表再打亂一次、打頭目（3 顆愛心，同一題只扣一次） ---------- */

const mondayOf = ds => { const d = new Date(ds + 'T00:00'); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return ymd(d); };
function weeklyStats(p, weeks = 8) {
  const mon = new Date(weekKey() + 'T00:00');
  const list = Array.from({ length: weeks }, (_, i) => { const d = new Date(mon); d.setDate(mon.getDate() - (weeks - 1 - i) * 7); return { id: ymd(d), n: 0, ok: 0, score: 0, sec: 0, days: 0 }; });
  const by = Object.fromEntries(list.map(w => [w.id, w]));
  Object.entries(p.daily || {}).forEach(([day, v]) => { const w = by[mondayOf(day)]; if (!w) return; w.n += v.n || 0; w.ok += v.ok || 0; w.score += v.score || 0; w.sec += v.sec || 0; if (v.n) w.days++; });

/* 小圖表：單一資料、一條軸；滑過或點一下顯示數字 */
function miniChart(rows, key, kind, color, fmt) {
  const W = 320, H = 150, L = 34, R = 24, T = 14, B = 26, iw = W - L - R, ih = H - T - B;
  const vals = rows.map(r => r[key]);
  const max = kind === 'rate' ? 1 : Math.max(10, ...vals.filter(v => v != null));
  const x = i => L + (rows.length === 1 ? iw / 2 : i * iw / (rows.length - 1));
  const y = v => T + ih - (v / max) * ih;
  const ticks = kind === 'rate' ? [0, 0.5, 1] : [0, Math.round(max / 2), max];
  const grid = ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="#DDE7DF" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end" font-size="10" fill="#5D7467">${kind === 'rate' ? Math.round(t * 100) + '%' : t}</text>`).join('');
  const xl = rows.map((r, i) => (i % 2 === rows.length % 2 || i === rows.length - 1) ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="#5D7467">${r.label}</text>` : '').join('');
  let marks = '';
  if (kind === 'rate') {
    const pts = rows.map((r, i) => r.rate == null ? null : [x(i), y(r.rate)]);
    let path = '', pen = false;
    pts.forEach(pt => { if (!pt) { pen = false; return; } path += `${pen ? 'L' : 'M'}${pt[0].toFixed(1)} ${pt[1].toFixed(1)} `; pen = true; });
    marks = `<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` +
      pts.map((pt, i) => pt ? `<circle cx="${pt[0]}" cy="${pt[1]}" r="${i === rows.length - 1 ? 5 : 4}" fill="${color}" stroke="#fff" stroke-width="2"/>` : '').join('');
  } else {
    const bw = Math.min(22, iw / rows.length - 6);
    marks = rows.map((r, i) => r[key] ? `<path d="M${x(i) - bw / 2} ${T + ih} V${y(r[key]) + 4} Q${x(i) - bw / 2} ${y(r[key])} ${x(i) - bw / 2 + 4} ${y(r[key])} H${x(i) + bw / 2 - 4} Q${x(i) + bw / 2} ${y(r[key])} ${x(i) + bw / 2} ${y(r[key]) + 4} V${T + ih} Z" fill="${color}"/>` : '').join('');
  }
  const hits = rows.map((r, i) => `<rect class="hit" x="${x(i) - iw / rows.length / 2}" y="${T}" width="${iw / rows.length}" height="${ih}" fill="transparent" data-tip="${r.label} 這週：${fmt(r)}"/>`).join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每週${kind === 'rate' ? '一次答對率' : '答題數'}">${grid}<line x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}" stroke="#B9C9BD"/>${marks}${xl}${hits}</svg><div class="tip" hidden></div></div>`;
}

/* 出一題：同年級時兩邊同一題（可以用聽的）；不同年級時各出各的，只出看得到的題型 */

  if (sub === 'math') {
    lv = pick(MATH_LEVELS.filter(l => levelForGrade(l, g) && !l.noDuel).map(l => l.id));   // 直式、跳石頭要一步一步算，不適合搶答

    sfx('fanfare'); narrate(my === foe ? '平手！兩個人都好厲害！' : my > foe ? '你贏了！好厲害！' : `${nameOr(mine === 'a' ? st.b : st.a)}贏了！下次再加油！`);
  }
}

function renderRemote() {

    : `<div class="r-slot empty">${petSVG('owl', '', 0, '#8A8F99', {})}<b>？</b><span class="save-note">${label}</span></div>`;

  if (R.entering) {

    screen.innerHTML = `<section class="stack">
      <p class="save-note">輸入朋友告訴你的 4 個數字</p>

      <p class="save-note">${!R.room ? '正在進入房間…' : lost ? '找不到這個房間的房主。請確認號碼對不對，或請朋友先按「開新房間」。' : '正在找房主…'}</p>${leaveBtn}</section>`;
    return;
  }
  if (!host && R.hostGone) { screen.innerHTML = `<section class="stack"><p class="notice">房主離開房間了，這一場結束。</p>${leaveBtn}</section>`; return; }
  if (!host && st.gt && st.gt !== R_TOK && st.phase !== 'lobby') { screen.innerHTML = `<section class="stack"><p class="notice">這個房間已經有兩個人在比賽了，換一組號碼吧。</p>${leaveBtn}</section>`; return; }
  const mine = host ? 'a' : 'b', foeSide = host ? 'b' : 'a';
  const meP = R.me, foeP = host ? (st.phase === 'lobby' ? cleanProf(rOpponent()?.presence.p) : st.b) : st.a;
  if (st.phase === 'lobby') {
    const ready = host && !!foeP;
    screen.innerHTML = `<section class="stack">
      <p class="save-note">房間號碼</p><div class="r-code">${esc(R.code)}</div>
      <p class="save-note">${host ? '把這 4 個數字告訴朋友，請他在自己的平板按「加入房間」輸入。' : '已經進入房間，等房主按「開始對戰」…'}</p>
      <div class="r-vs">${slot(meP, '你')}<b>VS</b>${slot(foeP, host ? (foeP ? '對手' : '等朋友加入…') : '房主')}</div>
      <p class="save-note">${CN_NUM[st.g] || ''}年級的字，共 ${st.n} 題，誰先點對誰得分。點錯要停 2 秒。</p>
      ${host ? `<button class="btn-big go" data-act="r-start" ${ready ? '' : 'disabled'}>開始對戰！</button>` : ''}${leaveBtn}
    </section>`;
    return;
  }
  const my = mine === 'a' ? st.sa : st.sb, fs = mine === 'a' ? st.sb : st.sa;
  if (st.phase === 'over') {
    const win = my === fs ? null : my > fs ? meP : foeP;
    screen.innerHTML = `<section class="stack result">
      <div class="pair" style="display:flex;gap:16px;align-items:flex-end">${petSVG(meP.animal || 'owl', my >= fs ? 'happy' : '', tierOf(meP.stars || 0), meP.color, meP.equip || {})}${foeP ? petSVG(foeP.animal || 'owl', fs >= my ? 'happy' : '', tierOf(foeP.stars || 0), foeP.color, foeP.equip || {}) : ''}</div>
      <h2>${win ? `${win === meP ? '你' : esc(win.name)}贏了！` : '平手！'}</h2>
      <p class="score-line">你 ${esc(meP.name)} <b>${my}</b> ： <b>${fs}</b> ${esc((foeP || {}).name || '對手')}</p>
      <div class="btn-row">${host ? `<button class="btn-big" data-act="r-again" ${rOpponent() ? '' : 'disabled'}>再比一次</button>` : '<p class="save-note">等房主按「再比一次」…</p>'}${leaveBtn}</div>
    </section>`;
    return;
  }
  const q = st.q, wrong = mine === 'a' ? st.wa : st.wb, foeWrong = mine === 'a' ? st.wb : st.wa;
  const locked = st.phase === 'q' && Date.now() < R.lockUntil;
  const foeNote = host && R.waitGuest ? '斷線了，等他回來…' : st.win === foeSide ? '答對了！' : foeWrong.length ? `點錯 ${foeWrong.length} 次` : '';
  const myNote = locked ? '停 2 秒…' : st.win === mine ? '答對了！' : R.pending != null ? '送出了…' : '';
  screen.innerHTML = `<section class="duel rduel">
    <div class="r-foe ${st.win === foeSide ? 'won' : ''}">${petSVG((foeP || {}).animal || 'owl', st.win === foeSide ? 'happy' : '', tierOf((foeP || {}).stars || 0), (foeP || {}).color || COLORS[0], (foeP || {}).equip || {})}<b>${esc((foeP || {}).name || '對手')}</b><span class="duel-score">${fs} 分</span><em>${foeNote}</em></div>
    <div class="duel-mid"><span>第 ${st.idx + 1}／${st.n} 題</span><button class="icon-btn sound" data-act="r-replay" aria-label="再聽一次">${ICONS.speaker}</button><span>你 ${my} ： ${fs} 對手</span></div>
    <div class="duel-half r-me ${locked ? 'locked' : ''} ${st.win === mine ? 'won' : ''}">
      <div class="duel-name">${petSVG(meP.animal || 'owl', st.win === mine ? 'happy' : '', tierOf(meP.stars || 0), meP.color, meP.equip || {})}<b>${esc(meP.name)}</b><span class="duel-score">${my} 分</span><em>${myNote}</em></div>
      ${q.type === 'zhuyin' ? `<div class="duel-q">${esc(q.char)}</div>` : ''}
      <div class="opts ${q.type === 'zhuyin' ? 'zy-mode' : ''}">${q.options.map((o, i) => {
        const right = st.phase === 'show' && i === st.ans, tried = wrong.includes(i);
        return `<button class="opt ${q.type === 'zhuyin' ? 'zy' : 'char'} ${right ? (st.win === mine ? 'right' : 'reveal') : ''} ${tried ? 'tried' : ''} ${R.pending === i ? 'pending' : ''}" data-act="r-pick" data-i="${i}" ${st.phase !== 'q' || tried || locked || R.pending != null ? 'disabled' : ''}>${esc(o)}</button>`;
      }).join('')}</div></div></section>`;
}

/* ---------- 國字圖鑑 ---------- */
const DEX_REWARD = 100;
const KIND_TIP = { 象形: '照著東西的樣子畫出來的字', 指事: '用記號表示意思的字', 會意: '兩個以上的字合起來表示意思', 形聲: '一半表示意思、一半表示讀音', 形近: '長得很像，要小心分清楚', 破音: '同一個字有好幾種唸法，意思也不一樣' };
function recordDex(p, ch) { p.dex = p.dex || {}; const isNew = !p.dex[ch]; p.dex[ch] = (p.dex[ch] || 0) + 1; return isNew; }
const dexCount = (p, g) => BANK.filter(w => w.年級 === g && p.dex && p.dex[w.字]).length;
function renderDex() {
  const p = me(), gs = grades(), g = gs.includes(S.dexGrade) ? S.dexGrade : (S.grade || gs[0]);
  setBar('國字圖鑑');
  const words = BANK.filter(w => w.年級 === g), got = dexCount(p, g);
  screen.innerHTML = `<section class="stack">
    <div class="dex-tabs">${gs.map(x => `<button class="btn-small" data-act="dex-tab" data-g="${x}" aria-pressed="${x === g}">${CN_NUM[x]}年級（${dexCount(p, x)}／${BANK.filter(w => w.年級 === x).length}）</button>`).join('')}</div>
    <div class="me-bar dex-prog" style="display:block"><div class="me-top"><span>已收集 ${got}／${words.length} 張</span><span class="me-stars">${p.dexDone && p.dexDone[g] ? '這一頁集滿了！' : `集滿這頁送 ${DEX_REWARD} 金幣`}</span></div>
      <div class="meter"><i style="width:${Math.round(got / words.length * 100)}%"></i></div></div>
    <div class="dex-grid">${words.map(w => p.dex && p.dex[w.字]
      ? `<button class="dex-card got" data-act="dex-open" data-ch="${esc(w.字)}"><b>${esc(w.字)}</b><small>${esc(w.注音)}</small></button>`
